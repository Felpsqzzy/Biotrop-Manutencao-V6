/* ================================================================ 1. tokens (claro) */
:root{
  color-scheme:light;
  --bm-s1:4px;--bm-s2:8px;--bm-s3:12px;--bm-s4:16px;--bm-gutter:24px;
  --bm-r-xs:8px;--bm-r-ctl:12px;--bm-r-card:18px;--bm-r-lg:22px;--bm-r-pill:999px;
  --bm-fast:140ms;--bm-med:220ms;--bm-slow:320ms;--bm-ease:cubic-bezier(.22,1,.36,1);
  --bm-top:64px;
  --bm-font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable Text","Segoe UI",Inter,system-ui,sans-serif;
  --bm-font-tit:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI Variable Display","Segoe UI",Inter,system-ui,sans-serif;
  --bm-bg:#f5f4f1;--bm-surface:#ffffff;--bm-surface-2:#f8f7f4;--bm-surface-3:#efeee9;
  --bm-line:rgb(22 32 27 / 9%);--bm-line-strong:rgb(22 32 27 / 16%);
  --bm-ink:#15201b;--bm-ink-2:#4f5e57;--bm-ink-3:#77857e;
  --bm-accent:#00845d;--bm-accent-fill:#00845d;--bm-on-accent:#ffffff;--bm-accent-soft:rgb(0 132 93 / 10%);--bm-accent-line:rgb(0 132 93 / 28%);--bm-focus:rgb(0 132 93 / 45%);
  --bm-ok:#14804f;--bm-warn:#b25e00;--bm-warn-soft:rgb(214 120 10 / 13%);--bm-bad:#c2313b;--bm-bad-soft:rgb(194 49 59 / 10%);
  --bm-shadow-1:0 1px 2px rgb(16 24 20 / 6%),0 4px 14px -8px rgb(16 24 20 / 12%);
  --bm-shadow-2:0 2px 4px rgb(16 24 20 / 6%),0 16px 40px -18px rgb(16 24 20 / 22%);
  --bm-glass:rgb(255 255 255 / 78%);--bm-blur:saturate(160%) blur(20px);
  --bm-panel:linear-gradient(180deg,#ffffff 0%,#fbfaf7 100%);--bm-highlight:rgb(255 255 255 / 95%);
  --bm-ambient:radial-gradient(1200px 700px at 85% -10%,rgb(0 132 93 / 7%),transparent 60%),radial-gradient(900px 600px at -10% 105%,rgb(0 120 140 / 5%),transparent 60%);
  --bm-lift:0 2px 4px rgb(16 24 20 / 6%),0 14px 30px -14px rgb(16 24 20 / 22%);
  --bm-campo:rgb(255 255 255 / 75%);
  /* nomes do pcm.css apontando para os tokens (como o site faz no app logado) */
  --pc-ink:var(--bm-ink);--pc-muted:var(--bm-ink-2);--pc-faint:var(--bm-ink-3);
  --pc-accent:var(--bm-accent);--pc-accent-2:var(--bm-accent-fill);--pc-accent-soft:var(--bm-accent-soft);
  --pc-bad:var(--bm-bad);--pc-bad-soft:var(--bm-bad-soft);--pc-warn:var(--bm-warn);--pc-warn-soft:var(--bm-warn-soft);
  --pc-glass:var(--bm-surface);--pc-glass-strong:var(--bm-surface-2);--pc-glass-soft:var(--bm-surface-2);
  --pc-edge:var(--bm-line);--pc-line:var(--bm-line);--pc-shadow:var(--bm-shadow-1);--pc-r:var(--bm-r-card);
  /* texto pequeno do módulo sobre fundo tingido (selos, cabeçalho de tabela 11px, valores negativos): contraste ≥ 4.5:1 mesmo com
     o selo sobre a linha tingida (ex.: "Divergente" numa linha divergente). Os tons do --bm-* ficam para ícone, borda e número grande. */
  --inv-tx-th:var(--bm-ink-2);--inv-tx-ok:#006b4b;--inv-tx-warn:#8a4700;--inv-tx-bad:#a8222c;
  /* tom apagado (placeholder, número do chip de filtro, etapa que não precisou): token, nunca opacity. O --bm-ink-3 dá 3,3–3,9:1 no
     claro; este dá ≥ 4,6:1 até sobre o --bm-surface-3. Número de KPI em alerta (18px no celular = texto normal): ≥ 5,4:1 no painel. */
  --inv-tx-fraco:#5f6d66;--inv-kpi-warn:#9c5200;
  /* link de texto pequeno (12,5px: "todos os locais", "Justificar"): o --bm-accent dá 4,1:1 sobre a linha marcada (accent-soft); este, ≥ 5,9:1 */
  --inv-tx-link:#006b4b;

  --inv-danger-fill:#c2313b;--inv-on-danger:#ffffff

  --bm-bg:#101411;--bm-surface:#161c18;--bm-surface-2:#1b231e;--bm-surface-3:#222c26;
  --bm-line:rgb(255 255 255 / 8%);--bm-line-strong:rgb(255 255 255 / 14%);
  --bm-ink:#f2f5f3;--bm-ink-2:#aebbb4;--bm-ink-3:#7f8d86;
  --bm-accent:#2fcf95;--bm-accent-fill:#00b981;--bm-on-accent:#03150e;--bm-accent-soft:rgb(0 185 129 / 13%);--bm-accent-line:rgb(0 185 129 / 34%);--bm-focus:rgb(0 185 129 / 55%);
  --bm-ok:#43cf8e;--bm-warn:#f2a54a;--bm-warn-soft:rgb(242 165 74 / 14%);--bm-bad:#f2737b;--bm-bad-soft:rgb(242 115 123 / 13%);
  --bm-shadow-1:0 1px 2px rgb(0 0 0 / 35%);--bm-shadow-2:0 2px 6px rgb(0 0 0 / 30%),0 18px 44px -20px rgb(0 0 0 / 70%);
  --bm-glass:rgb(18 23 20 / 80%);
  --bm-panel:linear-gradient(180deg,#1a221d 0%,#151b17 100%);--bm-highlight:rgb(255 255 255 / 6%);
  --bm-ambient:radial-gradient(1200px 700px at 85% -10%,rgb(0 185 129 / 9%),transparent 60%),radial-gradient(900px 600px at -10% 105%,rgb(0 150 160 / 6%),transparent 60%);
  --bm-lift:0 2px 6px rgb(0 0 0 / 35%),0 18px 36px -16px rgb(0 0 0 / 70%);
  --bm-campo:rgb(0 0 0 / 22%);
  --pc-ink:var(--bm-ink);--pc-muted:var(--bm-ink-2);--pc-faint:var(--bm-ink-3);
  --pc-accent:var(--bm-accent);--pc-accent-2:var(--bm-accent-fill);--pc-accent-soft:var(--bm-accent-soft);
  --pc-bad:var(--bm-bad);--pc-bad-soft:var(--bm-bad-soft);--pc-warn:var(--bm-warn);--pc-warn-soft:var(--bm-warn-soft);
  --pc-glass:var(--bm-surface);--pc-glass-strong:var(--bm-surface-2);--pc-glass-soft:var(--bm-surface-2);
  --pc-edge:var(--bm-line);--pc-line:var(--bm-line);--pc-shadow:var(--bm-shadow-1);
  --inv-tx-th:var(--bm-ink-2);--inv-tx-ok:#5ee0a8;--inv-tx-warn:#f7b968;--inv-tx-bad:#ff9aa0;
  --inv-tx-fraco:#8d9a93;--inv-kpi-warn:var(--bm-warn);
  --inv-tx-link:var(--bm-accent);
  /* o --bm-bad do escuro (#f2737b) é tom de texto/ícone: com texto branco dá 2,8:1. O botão cheio fica no vermelho do claro (5,5:1) */
  --inv-danger-fill:#c2313b;--inv-on-danger:#ffffff
}

/* ================================================================ 2. base */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;background:var(--bm-bg)}
body{margin:0;font:16px/1.5 var(--bm-font);color:var(--bm-ink);background:var(--bm-ambient),var(--bm-bg);background-attachment:fixed;-webkit-font-smoothing:antialiased}
#app{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
button,input,select,textarea{font:inherit;color:inherit}
img{max-width:100%}
h1,h2,h3{margin:0;letter-spacing:-.022em;color:var(--bm-ink);font-family:var(--bm-font-tit)}
p{margin:0}
::selection{background:var(--bm-accent-soft);color:var(--bm-ink)}
:is(button,a,input,select,textarea,summary,[tabindex]):focus-visible{outline:3px solid var(--bm-focus);outline-offset:2px}
input[type=checkbox],input[type=radio]{accent-color:var(--bm-accent-fill)}
/* placeholder de todo campo (inclusive "definir depois" e o "—" da quantidade) no tom apagado com contraste */
::placeholder{color:var(--inv-tx-fraco);opacity:1}
/* [hidden] vale mesmo com display do componente (ex.: .inv-sel é inline-flex) */
[hidden]{display:none !important}
.sr-only{position:absolute !important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.iv-noscript{max-width:640px;margin:40px auto;padding:16px 18px;border-radius:12px;background:#fff2d4;color:#6b4500;font:15px/1.5 system-ui,sans-serif}

/* ================================================================ 3. casca: topo (bm-shell.css) e área da página */
.bm-top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;height:var(--bm-top);padding:0 var(--bm-gutter);
  border-bottom:1px solid var(--bm-line);background:var(--bm-glass);-webkit-backdrop-filter:var(--bm-blur);backdrop-filter:var(--bm-blur)}
.bm-marca{display:flex;align-items:center;gap:10px;flex:none;padding-right:14px;border-right:1px solid var(--bm-line)}
.bm-marca-ic{width:32px;height:32px;object-fit:contain}
.bm-marca strong{display:block;font-size:20px;line-height:1.1;font-weight:800;letter-spacing:-.01em;color:var(--bm-ink)}
.bm-marca strong b{color:var(--bm-accent);font-weight:800}
.bm-marca span{display:block;margin-top:2px;font-size:11.5px;font-weight:550;white-space:nowrap;color:var(--bm-ink-3)}
.bm-local{display:flex;align-items:center;gap:8px;min-width:0;font-size:14px;color:var(--bm-ink-3)}
.bm-local strong{font-size:15px;font-weight:650;color:var(--bm-ink)}
.bm-top-fim{margin-left:auto;display:flex;align-items:center;gap:10px}
.bm-db{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 12px;border-radius:var(--bm-r-pill);font-size:13px;color:var(--bm-ink-2);white-space:nowrap;
  background:var(--bm-panel);border:1px solid var(--bm-line);box-shadow:inset 0 1px 0 var(--bm-highlight)}
.bm-db i{width:8px;height:8px;border-radius:50%;background:var(--bm-ok)}
.bm-db.is-off{color:var(--bm-warn)}
.bm-db.is-off i{background:var(--bm-warn)}
.bm-logo{display:block;height:30px;width:auto;padding:4px 8px;border-radius:10px;background:#fff}
.bm-ic{display:grid;place-items:center;flex:none;width:40px;height:40px;border:0;border-radius:var(--bm-r-ctl);background:transparent;color:var(--bm-ink-2);cursor:pointer;transition:background-color var(--bm-fast) ease,color var(--bm-fast) ease}
.bm-ic:active{transform:scale(.92)}
.bm-pagina{flex:1;width:100%;padding:var(--bm-gutter) var(--bm-gutter) 48px}

/* ================================================================ 4. cabeçalho de página (page-title-row) */
.page-title-row{position:relative;overflow:hidden;isolation:isolate;display:flex;align-items:center;flex-wrap:wrap;gap:14px;min-height:112px;margin:0 0 var(--bm-gutter);padding:22px var(--bm-gutter);
  border-radius:var(--bm-r-card);border:1px solid var(--bm-line);background:var(--bm-surface)}
/* o site põe uma foto à direita; aqui (sem rede) fica a luz verde do tema no lugar */
.page-title-row::after{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(600px 220px at 100% 50%,var(--bm-accent-soft),transparent 70%)}
.page-icon{width:46px;height:46px;border-radius:16px;display:grid;place-items:center;flex-shrink:0;color:var(--bm-accent);
  background:linear-gradient(145deg,rgba(13,95,100,.16),rgba(13,95,100,.06));border:1px solid rgba(13,95,100,.16);box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
body.v12-dark .page-icon{background:var(--bm-accent-soft);border-color:var(--bm-accent-line);box-shadow:none}
.page-title-row h1{font-size:clamp(22px,2.2vw,30px);font-weight:800;line-height:1.15;letter-spacing:-.02em;color:var(--bm-ink);margin:0 0 4px}
.page-title-row p{font-size:13.5px;color:var(--bm-ink-2);margin:0}

/* ================================================================ 5. componentes do site (pcm.css + bm-componentes.css) */
.pcm{font-family:var(--bm-font);color:var(--pc-ink)}
.pcm *,.pcm-layer *{box-sizing:border-box}
:where(.pcm,.pcm-layer) :where(button,input,select){font:inherit;color:inherit}
/* cartão: chapado, gradiente leve e brilho na borda de cima */
.pcm-glass{position:relative;background:var(--bm-panel);border:1px solid var(--bm-line);border-radius:var(--bm-r-card);box-shadow:var(--bm-shadow-1),inset 0 1px 0 var(--bm-highlight)}
/* botões */
.pcm-btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:40px;padding:0 16px;border-radius:var(--bm-r-ctl);border:1px solid var(--bm-line-strong);
  background:var(--bm-panel);color:var(--bm-ink);font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;text-decoration:none;box-shadow:inset 0 1px 0 var(--bm-highlight);
  transition:transform 220ms var(--bm-ease),box-shadow 220ms ease,background-color 160ms ease,border-color 160ms ease,color 160ms ease,filter 160ms ease}
.pcm-btn:not(:disabled):active{transform:translateY(0) scale(.97);transition-duration:80ms}
.pcm-btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.pcm-btn--primary{background:linear-gradient(180deg,rgb(255 255 255 / 18%),rgb(255 255 255 / 0) 60%),var(--bm-accent-fill);color:var(--bm-on-accent);border-color:transparent;
  box-shadow:0 8px 18px -10px var(--bm-accent-fill),inset 0 1px 0 rgb(255 255 255 / 22%)}
.pcm-btn--danger{color:var(--bm-bad)}
.pcm-btn--danger-fill{background:var(--inv-danger-fill);color:var(--inv-on-danger);border-color:transparent}
.pcm-btn--ghost{background:transparent;border-color:transparent;box-shadow:none}
.pcm-btn--sm{min-height:32px;padding:0 12px;font-size:13px}
.pcm-btn--icon{width:36px;min-height:36px;padding:0}
@media (hover:hover) and (pointer:fine){
  .pcm-btn:not(.pcm-btn--primary):not(.pcm-btn--ghost):not(.pcm-btn--danger-fill):not(:disabled):hover{transform:translateY(-1px);border-color:var(--bm-accent-line);box-shadow:var(--bm-lift),inset 0 1px 0 var(--bm-highlight)}
  .pcm-btn--primary:not(:disabled):hover,.pcm-btn--danger-fill:not(:disabled):hover{transform:translateY(-1px);filter:brightness(1.06);box-shadow:0 12px 26px -10px var(--bm-accent-fill),inset 0 1px 0 rgb(255 255 255 / 25%)}
  .pcm-btn--ghost:not(:disabled):hover{background:var(--bm-surface-2)}
  .bm-ic:hover{background:var(--bm-surface-3);color:var(--bm-ink)}
}
/* abas segmentadas */
.pcm-tabs{display:flex;justify-content:center;margin:0 0 18px}
.pcm-seg{position:relative;display:inline-flex;padding:4px;border-radius:999px;background:rgb(15 42 39 / 6%);border:1px solid var(--bm-line);gap:2px}
body.v12-dark .pcm-seg{background:rgb(255 255 255 / 6%)}
.pcm-seg button{border:0;background:transparent;padding:10px 20px;border-radius:999px;font-size:14px;font-weight:600;color:var(--bm-ink-2);cursor:pointer;white-space:nowrap;transition:color 200ms ease,background-color 200ms ease,box-shadow 200ms ease}
.pcm-seg button[aria-selected="true"]{background:var(--bm-surface-2);color:var(--bm-ink);box-shadow:var(--bm-shadow-1),inset 0 1px 0 var(--bm-highlight)}
@media (hover:hover) and (pointer:fine){.pcm-seg button[aria-selected="false"]:hover{color:var(--bm-ink)}}
/* selo */
.pcm-chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:650;background:var(--bm-accent-soft);color:var(--bm-accent);white-space:nowrap}
.pcm-chip--muted{background:rgb(15 42 39 / 6%);color:var(--bm-ink-2)}
body.v12-dark .pcm-chip--muted{background:rgb(255 255 255 / 7%)}
/* no módulo, o selo verde usa o tom de texto (11.5px sobre o verde claro precisa de 4.5:1) */
.inv .pcm-chip:not(.pcm-chip--muted){color:var(--inv-tx-ok)}
/* vazio */
.pcm-empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:44px 20px;margin-bottom:16px;border-radius:18px;border:1.5px dashed rgb(15 42 39 / 14%);color:var(--bm-ink-2)}
body.v12-dark .pcm-empty{border-color:rgb(255 255 255 / 12%)}
.pcm-empty strong{color:var(--bm-ink);font-size:16px}
.pcm-empty span{max-width:60ch;font-size:14px}
/* folha modal */
.pcm-layer{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;padding:18px;background:rgb(6 10 8 / 48%);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);animation:pcm-fade 260ms ease both;font-family:var(--bm-font);color:var(--bm-ink)}
.pcm-sheet{width:min(560px,100%);max-height:calc(100dvh - 36px);display:flex;flex-direction:column;border-radius:28px;overflow:hidden;
  background:var(--bm-surface-2);border:1px solid var(--bm-line);box-shadow:0 30px 80px -20px rgb(0 0 0 / 40%);animation:pcm-sheet-in 420ms var(--bm-ease) both}
.pcm-sheet--wide{width:min(1000px,100%)}
@keyframes pcm-fade{from{opacity:0}}
@keyframes pcm-sheet-in{from{opacity:0;transform:translateY(40px) scale(.96)}}
.pcm-sheet-head{display:flex;align-items:center;gap:12px;padding:18px 20px;border-bottom:1px solid var(--bm-line)}
.pcm-sheet-head h2{font-size:19px;font-weight:700;flex:1;min-width:0}
.pcm-sheet-head small{display:block;font-size:12px;font-weight:600;color:var(--bm-ink-2);letter-spacing:0}
.pcm-sheet-body{padding:20px;overflow:auto;display:flex;flex-direction:column;gap:16px;flex:1}
.pcm-sheet-body>*{flex-shrink:0}
.pcm-sheet-body p{line-height:1.55}
.pcm-sheet-foot{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:10px;padding:14px 20px;border-top:1px solid var(--bm-line)}
.pcm-sheet-foot .pcm-err{margin-right:auto;align-self:center;font-size:13px;color:var(--bm-bad)}
/* campos */
.pcm-field{display:flex;flex-direction:column;gap:6px}
.pcm-label{font-size:13px;font-weight:650}
.pcm-help{font-size:12px;color:var(--bm-ink-2)}
.pcm-input{width:100%;height:44px;padding:0 14px;border-radius:13px;border:1px solid var(--bm-line-strong);background:var(--bm-campo);color:var(--bm-ink);font-size:15px;outline:none;transition:box-shadow 200ms ease,border-color 200ms ease}
.pcm-input:focus{border-color:var(--bm-accent);box-shadow:0 0 0 3px var(--bm-accent-soft)}
.pcm-input:disabled{opacity:.6;cursor:not-allowed}
.pcm-input::placeholder{color:var(--inv-tx-fraco);opacity:1}

/* ================================================================ 6. módulo Inventário (inventario.css do site) */
.inv{max-width:1500px;margin:0 auto;padding:4px 2px 48px}
.inv-head h1{margin:0 0 4px}
.inv-head>div:nth-child(2){flex:1 1 0;min-width:220px}
.inv-head-acoes{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap}
.inv-erro{background:var(--pc-bad-soft);color:var(--inv-tx-bad);padding:12px 14px;border-radius:14px;margin:0 0 14px;line-height:1.45}
.inv-erro small{color:inherit}
.inv-aviso{background:var(--pc-accent-soft);color:var(--pc-ink);padding:12px 16px;border-radius:16px;margin:0 0 16px;line-height:1.55;font-size:14px}
.inv-aviso--warn{background:var(--pc-warn-soft);color:var(--inv-tx-warn)}
.inv-aviso .inv-hist{margin-top:6px}
.inv-alerta{font-size:12.5px;color:var(--inv-tx-warn);background:var(--pc-warn-soft);padding:8px 10px;border-radius:10px;margin:6px 0}
.inv-muted{color:var(--pc-muted);font-size:13px;line-height:1.5}
.inv-p{margin:0 0 16px}
.inv-card{border-radius:var(--pc-r);padding:18px;margin-bottom:16px}
.inv-card h3{font-size:16px;margin-bottom:10px}
.inv-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:16px}
.inv-kpis--sm{grid-template-columns:repeat(auto-fit,minmax(140px,1fr));margin-bottom:0}
.inv-kpi{border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.inv-kpi small{font-size:12px;font-weight:650;color:var(--pc-muted)}
.inv-kpi b{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em;overflow-wrap:anywhere}
.inv-kpi span{font-size:12px;color:var(--pc-muted)}
.inv-kpis--sm .inv-kpi b{font-size:19px}
.inv-kpi--warn b{color:var(--inv-kpi-warn)}
.inv-kpis--3{grid-template-columns:repeat(3,minmax(0,1fr))}
.inv-kpi--btn{font:inherit;color:inherit;text-align:left;cursor:pointer;transition:box-shadow 180ms ease,transform 220ms var(--bm-ease)}
.inv-kpi--btn:active{transform:scale(.98)}
.inv-kpi--btn.is-on{box-shadow:var(--pc-shadow),inset 0 0 0 2px var(--pc-accent-2)}
.inv-bar{height:8px;border-radius:99px;background:var(--pc-line);overflow:hidden}
.inv-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pc-accent-2),var(--pc-accent));border-radius:inherit}
/* tabelas: rolam dentro do cartão; a página não */
.inv-tabela-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.inv-tabela{width:100%;border-collapse:separate;border-spacing:0;font-size:13.5px}
.inv-tabela th{font-size:11px;font-weight:650;text-transform:uppercase;letter-spacing:.05em;color:var(--inv-tx-th);text-align:left;padding:9px 10px;border-bottom:1px solid var(--pc-line);background:var(--bm-surface-2);white-space:nowrap}
.inv-tabela thead th{position:sticky;top:0;z-index:1}
.inv-tabela td{padding:9px 10px;border-bottom:1px solid var(--pc-line);vertical-align:top}
.inv-tabela tbody tr:last-child td{border-bottom:0}
.inv-tabela td small{display:block;color:var(--pc-muted);font-size:12px;line-height:1.4;margin-top:2px;max-width:420px}
.inv-tabela tr.is-sel td{background:var(--pc-accent-soft)}
.inv-tabela tr.is-divergente td{background:var(--pc-bad-soft)}
@media (hover:hover) and (pointer:fine){.inv-tabela tbody tr:hover td{background:var(--bm-surface-2)}.inv-tr-link:hover td{background:var(--pc-accent-soft)}}
.inv-tr-link{cursor:pointer;transition:background-color 160ms ease}
.inv-num,.inv-tabela th.inv-num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.inv-num.is-bad{color:var(--inv-tx-bad);font-weight:700}
.inv-acoes{text-align:right;white-space:nowrap}
.inv-acoes .pcm-btn+.pcm-btn{margin-left:6px}
.inv-td-prog{min-width:180px}
.inv-td-prog .inv-bar{margin:6px 0 4px}
.inv-link{border:0;background:none;padding:0;color:var(--inv-tx-link);font:inherit;font-size:12.5px;font-weight:650;cursor:pointer;text-decoration:underline;text-underline-offset:2px;display:block;margin-top:3px}
.inv-link--in{display:inline;margin:0}
.inv-lista-card{padding:6px 6px 10px}
.inv-lista-tit{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px 8px;font-size:14px;color:var(--pc-muted)}
.inv-lista-tit b{color:var(--pc-ink)}
.inv-pend{border:1px solid var(--pc-line);border-radius:14px;padding:10px 14px;margin-bottom:10px;background:var(--pc-glass-soft)}
.inv-pend summary{cursor:pointer;font-size:14px}
.inv-pend ul{margin:8px 0 0;padding-left:18px;max-height:240px;overflow:auto;font-size:13px;line-height:1.55}
.inv-form2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:10px}
.inv-map{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-top:12px}
.inv-map .pcm-input{height:38px;font-size:13px}
.inv-check{display:flex;align-items:center;gap:8px;font-size:14px;margin-top:8px;cursor:pointer}
.inv-check input{width:18px;height:18px}
.inv-textarea{height:auto;padding:10px 14px;resize:vertical;font:inherit}
.inv-confirm{line-height:1.6}
.inv-filtros{display:flex;flex-direction:column;gap:12px}
.inv-busca{position:relative;display:block}
.inv-busca input{width:100%;height:44px;border-radius:13px;border:1px solid var(--bm-line-strong);background:var(--bm-campo);padding:0 14px;font-size:15px;color:var(--bm-ink);outline:none}
.inv-busca input:focus{border-color:var(--bm-accent);box-shadow:0 0 0 3px var(--bm-accent-soft)}
.inv-busca--leitor svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--bm-ink-3);pointer-events:none}
.inv-busca--leitor input{height:52px;padding-left:42px;font-size:16px}
.inv-linha{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.inv-linha--fim{align-items:flex-end;margin-bottom:12px}
.inv-linha--centro{justify-content:center;margin-top:6px}
.inv-sel{display:inline-flex;flex-direction:column;gap:3px;font-size:11.5px;font-weight:650;color:var(--pc-muted)}
.inv-sel select,.inv-sel input{height:36px;border-radius:11px;border:1px solid var(--bm-line-strong);background:var(--bm-campo);padding:0 10px;font-size:13.5px;color:var(--pc-ink);max-width:260px;outline:none}
.inv-sel.is-on select,.inv-sel.is-on input,.inv-sel select:focus,.inv-sel input:focus{border-color:var(--pc-accent-2);box-shadow:0 0 0 3px var(--pc-accent-soft)}
.inv-selbar{position:sticky;top:calc(var(--bm-top) + 8px);z-index:5;display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;padding:10px 14px;margin-bottom:12px;border-radius:16px;
  background:var(--bm-surface-2);border:1px solid var(--bm-line);box-shadow:var(--pc-shadow);font-size:14px}
.inv-novo{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
.inv-listas{position:sticky;top:calc(var(--bm-top) + 12px);max-height:calc(100dvh - 90px);overflow:auto;display:flex;flex-direction:column;gap:12px}
.inv-listas h3{margin:0}
.inv-escopo{font-size:14px;color:var(--pc-muted)}
.inv-escopo b{color:var(--pc-ink)}
.inv-criar{width:100%}
.inv-listas-grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;margin-top:4px}
.inv-lista{border:1px solid var(--pc-line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--pc-glass-soft)}
.inv-lista.is-vazia{border-style:dashed;background:transparent}
.inv-lista-top{display:flex;gap:8px;align-items:center;justify-content:space-between}
.inv-lista-top b{font-size:14px;overflow-wrap:anywhere}
.inv-lista-pessoas{display:grid;gap:6px}
.inv-lista-pessoas label{display:grid;grid-template-columns:96px 1fr;align-items:center;gap:6px;font-size:12px;color:var(--pc-muted);font-weight:650}
.inv-lista-pessoas .pcm-input{height:34px;font-size:13px;padding:0 8px;border-radius:10px}
.inv-rodape-card{justify-content:flex-end;margin:14px 0 0}
.inv-pag{display:flex;justify-content:center;align-items:center;gap:14px;margin-top:14px;font-size:13px;color:var(--pc-muted)}
.inv-camp-head{display:flex;flex-direction:column;gap:8px}
.inv-camp-head>.pcm-btn{align-self:flex-start}
.inv-camp-tit{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.inv-camp-tit h2{font-size:22px;font-weight:700}
.inv-acomp-f{margin-bottom:10px}
.inv-acomp-f h3{margin:0 auto 0 0}
.inv-acomp-f .pcm-input{height:38px;width:auto;min-width:160px;font-size:13.5px}
.inv-acomp-f .pcm-input[type=search]{min-width:240px}
.inv-sit{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:99px;background:rgb(15 42 39 / 6%);color:var(--pc-muted);white-space:nowrap}
body.v12-dark .inv-sit{background:rgb(255 255 255 / 7%)}
.inv-sit--conferido{background:var(--pc-accent-soft);color:var(--inv-tx-ok)}
.inv-sit--divergente{background:var(--pc-bad-soft);color:var(--inv-tx-bad)}
.inv-sit--justificada{background:var(--pc-warn-soft);color:var(--inv-tx-warn)}
/* "Contagem cega" (cabeçalho do contador): selo próprio, neutro e com borda; não é situação de posição */
.inv-sit--cega{background:var(--bm-surface-2);color:var(--bm-ink);box-shadow:inset 0 0 0 1px var(--bm-line-strong)}
body.v12-dark .inv-sit--cega{background:var(--bm-surface-3)}
body.v12-dark .inv-sit--conferido{background:var(--pc-accent-soft)}
body.v12-dark .inv-sit--divergente{background:var(--pc-bad-soft)}
body.v12-dark .inv-sit--justificada{background:var(--pc-warn-soft)}
.inv-hist{margin:0;padding-left:18px;font-size:13.5px;line-height:1.5}
.inv-hist li{margin:2px 0}
.inv-hist small{display:block;color:var(--pc-muted)}
.inv-hist--ruim{color:var(--inv-tx-warn);max-height:260px;overflow:auto}
.inv-pills{display:flex;gap:6px;overflow-x:auto;padding:4px;margin-bottom:16px;border-radius:999px;background:rgb(15 42 39 / 5%);border:1px solid var(--pc-edge);scrollbar-width:none}
body.v12-dark .inv-pills{background:rgb(255 255 255 / 4%)}
.inv-pills::-webkit-scrollbar{display:none}
.inv-pills button{flex:none;border:0;background:transparent;padding:8px 14px;border-radius:999px;font:inherit;font-size:13.5px;font-weight:650;color:var(--pc-muted);cursor:pointer;white-space:nowrap}
.inv-pills button[aria-pressed="true"]{background:var(--pc-glass-strong);color:var(--pc-ink);box-shadow:var(--pc-shadow)}
/* passos do novo inventário */
.inv-passos{display:flex;gap:6px;list-style:none;margin:0 0 14px;padding:0;flex-wrap:wrap}
.inv-passos li{display:flex;align-items:center;gap:8px;padding:6px 14px 6px 6px;border-radius:999px;font-size:13px;font-weight:650;color:var(--pc-muted);background:var(--pc-glass-soft);border:1px solid var(--pc-line)}
.inv-passos li span{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--pc-line);font-size:12px}
.inv-passos li.is-atual{color:var(--pc-ink);border-color:var(--pc-accent-2)}
.inv-passos li.is-atual span{background:var(--pc-accent);color:var(--bm-on-accent)}
.inv-passos li.is-feito span{background:var(--pc-accent-soft);color:var(--inv-tx-ok)}
.inv-imp{display:flex;flex-direction:column;gap:14px}
.inv-imp h3{margin:0}
.inv-como{margin:0;padding-left:20px;font-size:14px;line-height:1.7;color:var(--pc-muted)}
.inv-como b{color:var(--pc-ink)}
.inv-arquivos{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.inv-arq{display:flex;flex-direction:column;gap:6px;align-items:flex-start;padding:14px;border-radius:16px;border:1.5px dashed var(--bm-line-strong);background:var(--pc-glass-soft);transition:border-color 160ms ease,background-color 160ms ease}
.inv-arq.is-sobre{border-color:var(--pc-accent);background:var(--pc-accent-soft)}
.inv-arq small{color:var(--pc-muted);font-size:12.5px;word-break:break-all}
.inv-ok{display:flex;align-items:center;gap:8px;padding:12px 14px;border-radius:14px;background:var(--pc-accent-soft);color:var(--inv-tx-ok);font-weight:650}
.inv-ok small{font-weight:400;color:var(--pc-muted)}
.inv-imp-acoes{display:flex;justify-content:flex-end}
.inv-base{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--pc-accent-soft);flex-wrap:wrap}
.inv-base>div{flex:1;min-width:200px;display:flex;flex-direction:column}
.inv-base small{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--inv-tx-ok)}
.inv-base span{font-size:13px;color:var(--pc-muted)}
.inv-base-ic{display:grid;place-items:center;width:36px;height:36px;border-radius:12px;background:var(--pc-accent);color:var(--bm-on-accent);flex:none}
/* contagem */
.inv-receber{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.inv-receber h3{margin:0 0 4px}
.inv-etapa{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;min-width:320px;padding:6px 0}
.inv-etapa+.inv-etapa{border-top:1px dashed var(--pc-line)}
.inv-etapa small{color:var(--pc-muted);font-size:12px}
.inv-etapa-acoes{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto}
.inv-cont-barra{display:flex;flex-direction:column;gap:10px}
.inv-dica{margin:0;font-size:12.5px;color:var(--pc-muted)}
.inv-dica kbd{font:inherit;font-size:11px;font-weight:700;padding:1px 6px;border-radius:6px;border:1px solid var(--pc-line);background:var(--pc-glass-strong)}
.inv-tabela--cont td{vertical-align:middle}
.inv-tabela--cont tr.is-preenchida td{background:var(--pc-accent-soft)}
.inv-tabela--cont tr.is-lido td{box-shadow:inset 0 2px 0 var(--pc-accent),inset 0 -2px 0 var(--pc-accent)}
.inv-th-q{text-align:right}
.inv-td-q{width:160px;text-align:right}
.inv-q{width:140px;height:38px;padding:0 12px;border-radius:11px;border:1px solid var(--bm-line-strong);background:var(--bm-campo);font:inherit;font-size:16px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums;color:var(--pc-ink)}
.inv-q:focus{outline:none;border-color:var(--pc-accent-2);box-shadow:0 0 0 3px var(--pc-accent-soft)}
.inv-q.is-erro{border-color:var(--pc-bad);background:var(--pc-bad-soft)}
tr.is-preenchida .inv-q{border-color:var(--pc-accent-2)}
.inv-loc{font-variant-numeric:tabular-nums;letter-spacing:.02em}
/* barra de confirmar: fixa no rodapé da tela, acima de tudo (no solo não há copiloto nem barra do celular) */
.inv-confirma{position:sticky;bottom:12px;z-index:30;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px 10px 18px;margin-top:6px;border-radius:999px;
  background:var(--bm-surface-2);border:1px solid var(--bm-line);box-shadow:var(--bm-shadow-2);font-size:14px}
.inv-conf-wrap{max-height:50vh}
/* campo de quantidade focado (Enter desce, leitor, toque): rola até ficar entre o topo fixo e a barra "Revisar e confirmar" */
.inv-tabela--cont .inv-q{scroll-margin:calc(var(--bm-top) + 12px) 0 calc(var(--inv-confirma-h,72px) + 24px)}
.inv-so-cel{display:none}
.inv-so-mob{display:none !important}
.inv-colar{min-height:150px;font:13px/1.45 ui-monospace,Consolas,"Cascadia Mono",monospace;white-space:pre;overflow:auto}
.inv-danif h3{color:var(--pc-bad)}
.inv-danif li{margin:6px 0}
.inv-danif .pcm-btn{margin-left:6px}
/* avisos (toast): empilham no centro, embaixo */
.inv-avisos{position:fixed;left:0;right:0;bottom:26px;z-index:4000;display:flex;flex-direction:column;align-items:center;gap:8px;padding:0 16px;pointer-events:none}
.inv-toast{max-width:min(560px,calc(100vw - 32px));background:#0f2a27;color:#fff;padding:12px 18px;border-radius:14px;box-shadow:0 14px 40px -10px rgb(0 0 0 / 45%);font:14px/1.4 var(--bm-font);pointer-events:auto;animation:inv-in 260ms ease both;transition:opacity 300ms}
.inv-toast:nth-last-child(n+4){display:none}
.inv-toast.is-bad{background:#8c2a31}
.inv-toast.is-out{opacity:0}
@keyframes inv-in{from{opacity:0;transform:translateY(12px)}}
/* tabelas largas rolam dentro do próprio wrap: o item de grade/flex não pode crescer com o min-content da tabela */
.inv-novo>*,.inv-card{min-width:0}

/* ================================================================ 6b. v2 (reunião de 14/10): novo inventário, linha do tempo, resultado, contagem */
/* filtro Site + Depósito da importação e repetidas */
.inv-filtro-local{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:16px;border:1px solid var(--pc-line);background:var(--pc-glass-soft)}
.inv-filtro-local p{margin-top:2px}
.inv-chips{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.inv-chips>.pcm-label{min-width:68px;color:var(--pc-muted)}
.inv-chip-f{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 12px;border-radius:999px;border:1px dashed var(--bm-line-strong);background:transparent;
  font:inherit;font-size:13px;font-weight:650;color:var(--pc-muted);cursor:pointer;text-decoration:line-through;transition:background-color 160ms ease,border-color 160ms ease,color 160ms ease}
.inv-chip-f small{font-weight:600;color:var(--inv-tx-fraco)}
.inv-chip-f.is-on small{color:inherit}
.inv-chip-f.is-on{border-style:solid;border-color:var(--pc-accent-2);background:var(--pc-accent-soft);color:var(--inv-tx-ok);text-decoration:none}
.inv-repetidas p+p{margin-top:4px}
.inv-ajuste-bar{justify-content:space-between}
.inv-ajuste{margin-top:-4px}
.pcm-btn.is-on{border-color:var(--pc-accent-2);color:var(--pc-accent)}
/* cabeçalho do novo inventário */
.inv-sub{font-size:14px;margin:18px 0 4px}
.inv-card h3.inv-sub{margin:18px 0 4px}
.inv-form3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:10px}
.inv-avancado{margin:16px 0 0}
.inv-avancado p{margin-top:8px}
.inv-cabform .pcm-field .pcm-help{min-height:0}
.inv-dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px 16px;margin:0}
.inv-dl div{min-width:0}
.inv-dl dt{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--inv-tx-th)}
.inv-dl dd{margin:2px 0 0;font-size:14.5px;font-weight:600;overflow-wrap:anywhere}
/* linha do tempo do inventário (M.fase) */
.inv-tempo-card{display:flex;flex-wrap:wrap;align-items:center;gap:14px 20px;padding:16px 18px}
.inv-tempo{flex:1 1 520px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));list-style:none;margin:0;padding:0}
.inv-tempo-passo{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-width:0;padding:0 4px}
/* traço que liga ao passo anterior: verde quando este passo já foi alcançado */
.inv-tempo-passo::before{content:"";position:absolute;top:16px;right:50%;width:100%;height:3px;border-radius:3px;background:var(--pc-line);z-index:0}
.inv-tempo-passo:first-child::before{display:none}
.inv-tempo-passo.is-feita::before,.inv-tempo-passo.is-atual::before{background:var(--pc-accent-2)}
.inv-tempo-passo.is-pulada::before{background:repeating-linear-gradient(90deg,var(--bm-line-strong) 0 6px,transparent 6px 11px)}
.inv-tempo-marca{position:relative;z-index:1;display:grid;place-items:center;width:34px;height:34px;border-radius:50%;font-size:14px;font-weight:800;
  background:var(--bm-surface);border:2px solid var(--bm-line-strong);color:var(--pc-muted);font-variant-numeric:tabular-nums}
.is-feita .inv-tempo-marca{background:var(--pc-accent-2);border-color:var(--pc-accent-2);color:var(--bm-on-accent)}
.is-atual .inv-tempo-marca{border-color:var(--pc-accent-2);color:var(--pc-accent);box-shadow:0 0 0 5px var(--pc-accent-soft)}
.is-pulada .inv-tempo-marca{border-style:dashed;color:var(--inv-tx-fraco)}
.inv-tempo-rot{display:flex;flex-direction:column;min-width:0}
.inv-tempo-rot b{font-size:13px;font-weight:700;line-height:1.25;color:var(--pc-ink)}
.inv-tempo-rot small{font-size:11.5px;color:var(--pc-muted);line-height:1.3}
.is-atual .inv-tempo-rot b{color:var(--pc-accent)}
.is-pendente .inv-tempo-rot b{color:var(--pc-muted)}
.is-pulada .inv-tempo-rot b{text-decoration:line-through;color:var(--inv-tx-fraco)}
.is-pulada .inv-tempo-rot small,.is-pulada .inv-tempo-curto{color:var(--inv-tx-fraco)}
.inv-tempo-acao{flex:0 0 auto;display:flex;gap:8px}
/* aviso com botão (etapa terminou) */
.inv-aviso--acao{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px}
.inv-aviso--acao>div{flex:1 1 320px}
/* resultado da etapa e próximo passo */
.inv-pills--etapas{display:inline-flex;margin-bottom:14px}
.inv-proximo{display:flex;flex-direction:column;gap:10px}
.inv-proximo.is-ok{flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:space-between;background:var(--bm-panel);box-shadow:var(--bm-shadow-1),inset 0 0 0 1px var(--pc-accent-2)}
.inv-proximo h3{margin:0}
.inv-proximo-acao{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.inv-proximo-acao p{flex:1 1 280px}
.inv-tabela tr.is-desvio td{background:var(--pc-warn-soft)}
.inv-tabela--res td:first-child b,.inv-c-cod b{white-space:nowrap}
.inv-num.is-sobra{color:var(--inv-tx-ok);font-weight:700}
/* cabeçalho de tabela que ordena */
.inv-ord{display:inline-flex;align-items:center;gap:4px;border:0;background:none;padding:0;margin:0;font:inherit;color:inherit;letter-spacing:inherit;text-transform:inherit;cursor:pointer;white-space:nowrap}
.inv-ord:hover,.inv-ord.is-on{color:var(--pc-ink)}
.inv-ord svg{flex:none}
th.inv-num .inv-ord{flex-direction:row-reverse}
/* finalizar (acompanhamento) */
.inv-final{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 20px}
/* REG.0715: título de cartão com botão ao lado (Cabeçalho · Editar; Materiais em RM/EM · Modelo) e o tipo/material na lista */
.inv-card-tit{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;margin-bottom:10px}
.inv-card-tit h3{margin:0}
.inv-tabela td small.inv-reg{color:var(--pc-muted);overflow-wrap:anywhere}
/* materiais em RM/EM: cartão do passo 1, prévia do casamento, bloco do inventário e a célula "A baixar" */
.inv-arq--rmem{border-color:var(--bm-accent-line)}
.inv-arq .inv-rmem-explica{color:var(--pc-muted);word-break:normal;overflow-wrap:anywhere}
.inv-rmem{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:16px;border:1px solid var(--bm-accent-line);background:var(--pc-glass-soft)}
.inv-rmem-tit{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:8px 12px}
.inv-rmem-tit>div{flex:1 1 260px;min-width:0}
.inv-rmem-tit p{margin-top:2px;overflow-wrap:anywhere}
.inv-rmem-n{margin:4px 0 2px;font-size:14.5px}
.inv-rmem-card .inv-linha{margin-top:10px}
.inv-rmem-motivo{margin-top:8px}
.inv-rmem-resumo{overflow-wrap:anywhere}
/* pendências da lista em dois blocos (leitura da planilha × casamento com os itens) e a faixa de baixas ignoradas */
.inv-rmem-pend{display:flex;flex-direction:column;gap:6px;min-width:0}
.inv-rmem-orig{margin:0;font-size:13.5px;color:var(--pc-muted);overflow-wrap:anywhere}
.inv-rmem-orig b{color:var(--pc-ink)}
.inv-rmem-ignoradas{overflow-wrap:anywhere}
.inv-tabela td.inv-rmem-cel small{color:var(--pc-muted);white-space:normal;overflow-wrap:break-word;max-width:180px;margin-left:auto}
.inv-final h3{margin:0 0 8px}
.inv-final-passos{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:14px}
.inv-final-passos li{display:flex;align-items:center;gap:8px;color:var(--pc-muted)}
.inv-final-passos li span{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;border:2px solid var(--bm-line-strong);flex:none}
.inv-final-passos li.is-ok{color:var(--pc-ink)}
.inv-final-passos li.is-ok span{background:var(--pc-accent-2);border-color:var(--pc-accent-2);color:var(--bm-on-accent)}
/* tabela do contador: Código · Descrição curta · Descrição longa · Posição · Unidade · Quantidade (unidade ao lado) */
.inv-c-longa{color:var(--pc-muted);font-size:12.5px;max-width:320px}
.inv-c-pos{white-space:nowrap}
.inv-q-caixa{display:inline-flex;align-items:center;gap:8px;justify-content:flex-end}
/* no desktop a coluna Unidade fica logo antes da Quantidade: a unidade repetida junto do campo só aparece no cartão do celular */
.inv-q-un{display:none;min-width:30px;font-size:12px;font-weight:700;color:var(--pc-muted);text-align:left}
/* fração em unidade inteira (UN, PC, CX…): aceita, com aviso na linha ("50,5 UN — confirme") */
.inv-q-aviso,.inv-tabela td small.inv-q-aviso{display:block;margin-top:4px;font-size:12px;font-weight:650;color:var(--inv-tx-warn);line-height:1.3}
.inv-q-aviso:empty,.inv-tabela td small.inv-q-aviso:empty{display:none}
.inv-tabela tr.is-frac td{background:var(--pc-warn-soft)}
.inv-tabela--cont tr.is-frac .inv-q{border-color:var(--pc-warn)}
.inv-frac-resumo b{color:inherit}
/* seletor "Ordenar" (contagem e resultados): só no celular, onde a tabela vira cartões e o cabeçalho clicável some */
.inv-cont-ord,.inv-res-ord{display:none}
/* Gerar 2ª/3ª com várias listas: quem conta em cada lista */
.inv-gerar-listas{display:flex;flex-direction:column;gap:12px}
.inv-gerar-lista .pcm-label small{font-weight:500;color:var(--pc-muted)}
/* prévia da coluna de quantidades colada: linha que já tinha valor (substitui) e valor recusado em destaque */
.inv-colprev-alerta{margin:0}
.inv-colprev-alerta ul{margin:0;padding-left:18px}
.inv-colprev-alerta li+li{margin-top:6px}
.inv-colprev-wrap{max-height:46vh;overflow:auto;border:1px solid var(--pc-line);border-radius:14px}
.inv-tabela.inv-colprev{min-width:0}
.inv-colprev td{vertical-align:middle}
.inv-colprev td.inv-num{white-space:normal}
.inv-colprev-cod b,.inv-colprev .inv-loc{white-space:nowrap}
.inv-tabela .inv-colprev-un{display:none}
.inv-colprev tr.is-tem td{background:var(--pc-warn-soft)}
.inv-colprev tr.is-ruim td{background:var(--pc-bad-soft)}
.inv-tabela .inv-colprev-nota{color:var(--inv-tx-warn);font-weight:650;max-width:none}
.inv-colprev tr.is-ruim .inv-colprev-nota{color:var(--inv-tx-bad)}
/* estado curto da linha do tempo ("agora", "feita"…): só no celular, no lugar do texto longo */
.inv-tempo-curto{display:none}

/* ================================================================ 6c. validação de custo, tipo de inventário e divisão por local (20/10) */
/* indicador da importação: lendo · válido · com rejeitados · falhou (cor na borda e no ícone; o estado também vai escrito no título) */
.inv-val{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:16px;border:1px solid var(--pc-line);border-left:4px solid var(--bm-line-strong);background:var(--pc-glass-soft);min-width:0}
.inv-val--ok{border-left-color:var(--bm-ok)}
.inv-val--rejeitados{border-left-color:var(--bm-warn)}
.inv-val--falha{border-left-color:var(--bm-bad)}
.inv-val-top{display:flex;align-items:flex-start;gap:12px;min-width:0}

.inv-val--ok .inv-val-ic{background:var(--pc-accent-soft);color:var(--inv-tx-ok)}
.inv-val--rejeitados .inv-val-ic{background:var(--pc-warn-soft);color:var(--inv-tx-warn)}
.inv-val--falha .inv-val-ic{background:var(--pc-bad-soft);color:var(--inv-tx-bad)}
.inv-val--rejeitados .inv-val-top b{color:var(--inv-tx-warn)}
.inv-val--falha .inv-val-top b{color:var(--inv-tx-bad)}
.inv-val-roda{width:16px;height:16px;border-radius:50%;border:2px solid var(--bm-line-strong);border-top-color:var(--pc-accent);animation:inv-roda 800ms linear infinite}
@keyframes inv-roda{to{transform:rotate(360deg)}}
.inv-val-regra{font-size:13.5px;color:var(--pc-ink)}
.inv-val .inv-erro{margin:0}
.inv-val-col{font-size:13.5px;color:var(--pc-muted);overflow-wrap:anywhere}
.inv-val-col b{color:var(--pc-ink)}
.inv-val-rej{display:flex;flex-direction:column;gap:8px;min-width:0}
.inv-val-rej .inv-card-tit{margin:4px 0 0}
.inv-val-rej h4{margin:0;font-size:14.5px}
.inv-rej{margin:0}
.inv-rej summary{overflow-wrap:anywhere}
.inv-rej-lista{list-style:none;padding-left:0}
.inv-pend .inv-rej-lista{padding-left:0}
.inv-rej-lista li{padding:6px 0;border-bottom:1px solid var(--pc-line);overflow-wrap:anywhere}
.inv-rej-lista li:last-child{border-bottom:0}
.inv-rej-lista small{display:block;font-size:12px;color:var(--pc-muted)}
.inv-rej-linha{font-size:12px;font-weight:650;color:var(--pc-muted)}
/* tipo de inventário: cartões com rádio (obrigatório), com a dica do que o tipo confere */
.inv-tipos{border:0;margin:16px 0 0;padding:0;min-width:0}
.inv-tipos legend{padding:0;margin-bottom:8px}
.inv-tipos-op{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.inv-tipo{position:relative;display:flex;align-items:flex-start;gap:10px;padding:12px;border-radius:14px;border:1px solid var(--bm-line-strong);background:var(--bm-campo);cursor:pointer;min-width:0;transition:border-color 160ms ease,box-shadow 160ms ease}
.inv-tipo input{width:18px;height:18px;margin:2px 0 0;flex:none}
.inv-tipo span{display:flex;flex-direction:column;gap:2px;min-width:0}
.inv-tipo b{font-size:14px;line-height:1.3}
.inv-tipo small{font-size:12px;line-height:1.4;color:var(--pc-muted);overflow-wrap:anywhere}
.inv-tipo:has(input:checked){border-color:var(--pc-accent-2);box-shadow:0 0 0 3px var(--pc-accent-soft);background:var(--pc-accent-soft)}
.inv-tipo:has(input:focus-visible){outline:3px solid var(--bm-focus);outline-offset:2px}
.inv-falta{color:var(--inv-tx-warn)}
.inv-tipo-livre{margin-top:10px;overflow-wrap:anywhere}
/* prévia de quantas listas a divisão faz */
.inv-div-previa{font-size:13px;font-weight:650;color:var(--inv-tx-ok)}
p.inv-div-previa{margin-top:10px}
.inv-linha--fim .inv-div-previa{align-self:center}
/* inventário antigo com posição sem custo e o bloco "Importação" do histórico */
.inv-semcusto{overflow-wrap:anywhere}
.inv-imp-hist .inv-dl{margin-bottom:4px}
.inv-imp-motivos{margin-top:8px;overflow-wrap:anywhere}

/* ================================================================ 7. telas menores (o cabeçalho quebra em vez de cortar) */
@media (max-width:1100px){.inv-novo{grid-template-columns:minmax(0,1fr)}.inv-listas{position:static;max-height:none}}
@media (max-width:860px){
  .bm-top{height:56px;padding:0 12px;gap:8px}
  .bm-local,.bm-marca span,.bm-logo{display:none}
  .bm-marca{border:0;padding:0}
  .bm-db{padding:0 10px;font-size:12px}
  .bm-pagina{padding:16px 12px 40px}
  .page-title-row{min-height:0;padding:16px;gap:10px 12px;margin-bottom:16px}
  .page-icon{width:38px;height:38px;border-radius:11px}
  .page-icon svg{width:18px;height:18px}
  .page-title-row h1{font-size:20px}
  .page-title-row p{font-size:12.5px}
  /* correção do site: no celular os botões do cabeçalho iam além da borda; aqui descem e ocupam a largura toda */
  .inv-head-acoes{flex:1 1 100%;margin-left:0;width:100%}
  .inv-head-acoes .pcm-btn{flex:1 1 180px;min-width:0;white-space:normal;text-align:center}
}
@media (max-width:650px){
  /* abas do topo: dividem a largura (sem rolar por dentro); o rótulo quebra em duas linhas e nenhuma encosta na borda */
  .pcm-tabs .pcm-seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);width:100%;padding:4px;gap:4px;border-radius:18px;overflow:visible}
  .pcm-tabs .pcm-seg button{min-height:44px;padding:6px 8px;border-radius:14px;font-size:13px;line-height:1.2;white-space:normal;text-align:center}
  /* seções do inventário: quebram em linhas em vez de rolar escondidas */
  .inv-pills:not(.inv-pills--etapas){flex-wrap:wrap;overflow:visible;border-radius:18px}
  .inv-pills button{padding:8px 12px}
  .inv-tabela{min-width:720px}
  .inv-kpis{grid-template-columns:1fr 1fr}
  .inv-kpi b{font-size:18px}
  .inv-card{padding:14px}
  .inv-selbar{position:static}
  .inv-acomp-f .pcm-input{flex:1}
  .inv-tabela--camps{min-width:0}
  .inv-tabela--camps :is(th,td):nth-child(4){display:none}
  .inv-tabela--camps .inv-acoes .pcm-btn{margin:2px 0 2px 4px}
  .inv-td-prog{min-width:110px}
  .inv-kpis--3{grid-template-columns:1fr 1fr 1fr}
  .inv-kpis--3 .inv-kpi span{display:none}
  .inv-form3{grid-template-columns:minmax(0,1fr)}
  .inv-tempo-card{padding:14px 10px}
  .inv-tempo-acao{flex:1 1 100%}
  .inv-tempo-acao .pcm-btn{flex:1 1 0}
  /* barra "Revisar e confirmar" compacta: uma linha (contagem à esquerda, botões à direita), ~58px em vez de ~99px; o "vazio = não
     contado" e o "(fica salvo)" ficam só no desktop */
  .inv-tabela--cont{--inv-confirma-h:58px}
  .inv-confirma{bottom:8px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;border-radius:16px;padding:8px 8px 8px 12px;font-size:12.5px;line-height:1.25}
  .inv-confirma .inv-linha{flex-wrap:nowrap;gap:6px}
  .inv-confirma .pcm-btn{min-height:40px;padding:0 12px}
  .inv-so-desk{display:none}
  .inv-so-cel{display:inline}
  .inv-etapa{min-width:0}
  .inv-etapa-acoes{margin-left:0}
  .pcm-layer{padding:0;align-items:flex-end}
  .pcm-sheet{border-radius:26px 26px 0 0;max-height:94dvh;width:100%}
  .pcm-sheet-foot{padding-bottom:calc(14px + env(safe-area-inset-bottom))}
  .inv-lista-pessoas label{grid-template-columns:78px 1fr}
  /* a barra fixa "Revisar e confirmar" ocupa o rodapé: com ela na tela, os avisos aparecem no topo */
  .inv-avisos.inv-avisos--topo{bottom:auto;top:calc(56px + 10px + env(safe-area-inset-top))}
}
/* celular (≤ 600px): a contagem vira cartões legíveis, com o campo de quantidade grande e a unidade ao lado (o site futuro, em
   que o contador conta pelo celular). Sem cabeçalho de tabela: a ordem fica no seletor "Ordenar". */
@media (max-width:600px){
  .inv-cont-ord,.inv-res-ord{display:inline-flex}
  .inv-acomp-f .inv-res-ord{flex:1 1 100%}
  .inv-acomp-f .inv-res-ord select{max-width:none;width:100%}
  .inv-cont-barra .inv-sel select{max-width:none}
  .inv-tabela.inv-tabela--cont{min-width:0;display:block}
  .inv-tabela--cont thead{display:none}
  .inv-tabela--cont tbody{display:block}
  .inv-tabela--cont tr{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"cod pos" "desc desc" "longa longa" "q q";gap:4px 12px;padding:14px 12px;border-bottom:1px solid var(--pc-line)}
  .inv-tabela--cont tbody tr:last-child{border-bottom:0}
  .inv-tabela--cont td{display:block;padding:0;border:0;background:transparent !important}
  .inv-tabela--cont tr.is-preenchida{background:var(--pc-accent-soft)}
  .inv-tabela--cont tr.is-lido{box-shadow:inset 0 0 0 2px var(--pc-accent)}
  .inv-c-cod{grid-area:cod;font-size:15px}
  .inv-c-pos{grid-area:pos;text-align:right}
  .inv-c-pos .inv-loc{font-size:15px}
  .inv-c-desc{grid-area:desc;font-size:14.5px;line-height:1.4}
  .inv-c-longa{grid-area:longa;max-width:none}
  .inv-c-longa.is-vazia,.inv-c-un{display:none !important}
  .inv-td-q{grid-area:q;width:auto;text-align:left;margin-top:6px}
  .inv-q-caixa{display:flex;width:100%;justify-content:flex-start}
  /* min-width:0: sem ele o input fica com a largura intrínseca (size=20) e transborda a coluna */
  .inv-q{flex:1 1 0;min-width:0;width:auto;height:54px;font-size:22px;border-radius:14px}
  .inv-q-un{display:block;min-width:44px;font-size:15px;text-align:center}
  .inv-tempo-marca{width:28px;height:28px;font-size:12.5px}
  .inv-tempo-passo::before{top:13px}
  .inv-tempo-rot b{font-size:11px}
  /* o estado em texto curto (não só a cor), no lugar do texto longo */
  .inv-tempo-rot small{display:none}
  .inv-tempo-curto{display:block;font-size:10.5px;font-weight:650;line-height:1.25;color:var(--pc-muted)}
  .is-atual .inv-tempo-curto{color:var(--inv-tx-ok)}
  /* resultados: cada linha vira um cartão (como a contagem); os números levam o rótulo da coluna */
  .inv-tabela.inv-tabela--res{min-width:0;display:block}
  .inv-tabela--res thead{display:none}
  .inv-tabela--res tbody{display:block}
  .inv-tabela--res tr{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px 10px;padding:12px;border-bottom:1px solid var(--pc-line)}
  .inv-tabela--res tbody tr:last-child{border-bottom:0}
  .inv-tabela--res td{display:block;padding:0;border:0;background:transparent !important;min-width:0}
  .inv-tabela--res tr.is-desvio{background:var(--pc-warn-soft)}
  /* 1ª linha: código e situação; o selo quebra em vez de cortar ("Aguardando gerar 2ª contagem") */
  .inv-r-cod{grid-row:1;grid-column:1}
  .inv-r-sit{grid-row:1;grid-column:2 / 4;text-align:right}
  .inv-tabela--res .inv-r-sit .inv-sit{white-space:normal;text-align:right}
  .inv-r-pos{grid-column:1 / 3}
  .inv-r-un{grid-column:3;text-align:right}
  .inv-r-desc{grid-column:1 / -1;font-size:14px;line-height:1.4}
  .inv-tabela--res .inv-r-n{text-align:left}
  .inv-r-n::before{content:attr(data-rot);display:block;font-size:11px;font-weight:650;text-transform:uppercase;letter-spacing:.04em;color:var(--inv-tx-th)}
  .inv-final .pcm-btn,.inv-proximo-acao .pcm-btn{width:100%}
  /* prévia da colagem: sem a coluna Unidade (vai junto da quantidade) e com as notas quebrando, a tabela cabe sem rolar de lado */
  .inv-colprev :is(th,td):nth-child(3){display:none}
  .inv-colprev th{white-space:normal}
  .inv-colprev :is(th,td){padding:9px 8px}
  .inv-tabela .inv-colprev-un{display:inline;margin:0;font-size:12px}
  .inv-tabela .inv-colprev-nota{overflow-wrap:anywhere}
  /* tabelas de ações (Inventários, Minhas contagens, listas da Contagem, Acompanhamento): viram cartões, como Resultados e
     Contagem. Nada rola de lado e os botões ficam dentro da tela; o número leva o rótulo da coluna (data-rot). */
  .inv-tabela.inv-tabela--cartao{min-width:0;display:block}
  .inv-tabela--cartao thead{display:none}
  .inv-tabela--cartao tbody{display:block}
  .inv-tabela--cartao tr{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 12px;padding:12px;border-bottom:1px solid var(--pc-line)}
  .inv-tabela--cartao tbody tr:last-child{border-bottom:0}
  .inv-tabela--cartao td{display:block;padding:0;border:0;min-width:0;background:transparent !important}
  .inv-tabela--cartao td.inv-num{text-align:left;white-space:normal}
  .inv-tabela--cartao td[data-rot]::before{content:attr(data-rot);display:block;font-size:11px;font-weight:650;text-transform:uppercase;letter-spacing:.04em;color:var(--inv-tx-th)}
  .inv-tabela--cartao .inv-cel-larga{grid-column:1 / -1}
  .inv-tabela--cartao td.inv-td-prog{min-width:0}
  .inv-tabela--cartao td.inv-acoes{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:8px;text-align:left;white-space:normal}
  .inv-tabela--cartao .inv-acoes .pcm-btn,.inv-tabela--cartao .inv-acoes .pcm-btn+.pcm-btn{flex:1 1 0;min-width:0;min-height:40px;margin:0}
  .inv-tabela--cartao tr.is-divergente{background:var(--pc-bad-soft)}
  /* Inventários / Minhas contagens: nome · situação | listas (ou contador) · progresso · ações */
  .inv-tabela--camps.inv-tabela--cartao :is(th,td):nth-child(4){display:block}
  .inv-tabela--camps .inv-k-sit{grid-row:2;grid-column:1}
  .inv-tabela--camps td.inv-k-n{grid-row:2;grid-column:2;text-align:right}
  /* Contagem › listas: as ações da etapa ocupam a largura; "Contar aqui" é a principal (linha inteira, primeira) */
  .inv-tabela--listas .inv-etapa{min-width:0}
  .inv-tabela--listas .inv-etapa-acoes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;width:100%;margin:4px 0 0}
  .inv-tabela--listas .inv-etapa-acoes .pcm-btn{min-width:0;min-height:40px;padding:0 6px;white-space:normal;line-height:1.15;text-align:center}
  .inv-tabela--listas .inv-etapa-acoes .pcm-btn--primary{grid-column:1 / -1}
  /* Acompanhamento › posições: item · local | UM · saldo, 1ª, 2ª · 3ª, final, diferença · situação (3 colunas, como Resultados) */
  .inv-tabela--acomp.inv-tabela--cartao tr{grid-template-columns:repeat(3,minmax(0,1fr))}
  .inv-tabela--acomp .inv-a-local{grid-column:1 / 3}
  .inv-tabela--acomp .inv-a-un{text-align:right}
  .inv-tabela--acomp .inv-link{min-height:32px;display:inline-flex;align-items:center}
  /* com RM/EM: a linha secundária (tipo · documento) quebra dentro do cartão; nada rola de lado */
  .inv-tabela td.inv-rmem-cel small{max-width:none;margin-left:0}
  .inv-tabela--res td.inv-r-n{white-space:normal}
  .inv-rmem-card .inv-linha .pcm-btn{flex:1 1 100%;min-width:0;white-space:normal}
  .inv-arq--rmem .inv-linha{width:100%}
  .inv-arq--rmem .inv-linha .pcm-btn{flex:1 1 140px;min-width:0}
  /* validação de custo e tipo: tudo numa coluna, botão de baixar na largura toda */
  .inv-val-kpis{grid-template-columns:repeat(3,minmax(0,1fr))}
  .inv-val-kpis .inv-kpi{padding:10px}
  .inv-val-kpis .inv-kpi span{display:none}
  .inv-val-rej .inv-card-tit .pcm-btn{flex:1 1 100%;white-space:normal}
  .inv-tipos-op{grid-template-columns:minmax(0,1fr)}
  .inv-lista-tit>.inv-linha{width:100%}
}
@media (max-width:380px){.bm-db{display:none}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none !important;transition:none !important;scroll-behavior:auto !important}
}

<script>/* web/src/ui/xlsx.js */
/* BIOTROP · Planilha Excel (.xlsx) gerada no navegador
 *
 * Sem biblioteca externa: um .xlsx é um ZIP de arquivos XML. Aqui o ZIP é gravado
 * sem compressão (método "store"), que todo Excel/LibreOffice abre, e os textos vão
 * como inlineStr — não precisa de sharedStrings.
 *
 *   BiotropXlsx.download('arquivo.xlsx', [{
 *     name: 'Aba', cols: [12, 30], merges: ['A1:C1'], freeze: 'A7',
 *     rows: [[{ v: 'Título', s: 'title' }], ['texto', 12, { v: 'X', s: 'v1' }]]
 *   }]);
 *
 * Célula: valor puro (texto/número/Date) ou { v, s, f } com s = nome do estilo em STYLES e f = fórmula (inglês, sem "=", v = valor em cache).
 *
 * Extensões (só acrescentam; as planilhas antigas continuam iguais):
 *   BiotropXlsx.table({ name, title, subtitle, cols: [{ h, w, k, total }], rows, totals, footer, cf })  → aba pronta (faixa, cabeçalho verde, zebra, formatos, filtro, total)
 *   aba: freeze 'B5' · grid:false · tab · filter · cf (formatação condicional) · footer · printTitles · validations · charts (colunas/barras/pizza nativos) · portrait · breaks
 *   aba (22/10/2026): zoom · center (centralizar na página) · margins · footerRaw (rodapé com códigos &L/&C/&R) · printArea · gráfico 'doughnut' e look · estilos a4* (Resumo A4 do inventário)
 *   aba (23/10/2026, Excel do inventário): images (PNG preso às células) · tables (tabela do Excel: name, ref, columns [{ name, formula }], style; o cabeçalho da aba traz os nomes, de preferência
 *   com { ss: true } = texto compartilhado) · slicers (segmentações de dados da tabela: nome, caption, coluna, tabela, cache, from/to) · gráficos: line (linha no eixo secundário, Pareto),
 *   pointColors (cor por barra), look.hideVal / noGrid / labelSz · estilos dsh* (Dashboard), b* (Base) e c* (Calc)
 *   table: notes (instruções entre a faixa e o cabeçalho) · headHeight · rowHeight
 *   estilos de corpo: txt ctr int dec dec1 money pct pct100 date dtime qtd qtdS txtw (+ 'Z' = linha listrada), tot*, kpi*, banner, sec, good/warn/bad, inp, idLab/idVal, nota, regTit/regHead/regFaixa/regLab/regVal/regBox (ficha REG.0715)
 *   BiotropPrint: documento A4 para imprimir/PDF (cabeçalho BIOTROP, KPIs, gráficos SVG, tabelas) — ver o fim deste arquivo.
 */
(function () {
  'use strict';

  // Ordem = índice do cellXfs em styles.xml. Os 14 primeiros são os originais (não mudar a ordem: outros módulos usam o índice);
  // os demais foram acrescentados para planilhas com cara de produto (zebra, formatos pt-BR, totais, KPIs, semáforo).
  var STYLES = ['default', 'title', 'label', 'cell', 'center', 'head', 'v1', 'v2', 'v3', 'v4', 'section', 'muted', 'wrap', 'bold'];

  // Formatos numéricos (códigos no padrão do arquivo, que o Excel exibe na língua do usuário: vírgula decimal no Brasil).
  var NUMFMT = {
    int: '#,##0', dec: '#,##0.00', dec1: '0.0', pct: '0.0%', pct100: '0.0"%"',
    money: '"R$" #,##0.00;[Red]\\-"R$" #,##0.00', date: 'dd/mm/yyyy', dtime: 'dd/mm/yyyy\\ hh:mm',
    // acrescentados no fim (os ids acima não mudam): quantidade com 3 casas e com sinal (ajuste: + sobra, − falta)
    qtd: '#,##0.000', qtdS: '+#,##0.000;\\-#,##0.000;0.000',
    // Resumo A4 do inventário (22/10/2026, no fim): % com 2, 4 e 0 casas; R$ do modelo do almoxarifado (com "-" no zero e sem vermelho);
    // número com 2 casas e "-" no zero
    pct2: '0.00%', pct4: '0.0000%', pct0: '0%', rsA4: '"R$"\\ #,##0.00;[Red]\\-"R$"\\ #,##0.00', rsA4T: '"R$"\\ #,##0.00;[Red]\\-"R$"\\ #,##0.00;"-"',
    rsA4S: '"R$"\\ #,##0.00', decT: '#,##0.00;[Red]\\-#,##0.00;"-"',
    // Dashboard, Base e Calc do inventário (23/10/2026): quantidade sem zeros à direita, negativo em vermelho entre parênteses, R$ inteiro e com centavos, "n itens"
    qtd2: '#,##0.##', negP: '#,##0.00_);[Red](#,##0.00)', rs0P: '"R$"#,##0_);[Red]\\("R$"#,##0\\)', rs2P: '"R$"#,##0.00_);[Red]\\("R$"#,##0.00\\)', rs0: '"R$"#,##0', rs2: '"R$"#,##0.00',
    nItens: '0" itens"', nove: '#,##0.000000000'
