    cs.forEach(function (c) { if (!c) return; var k = nomeKey(c); if (vistos.has(k)) throw erro('A mesma pessoa não pode fazer duas contagens ' + onde + '.'); vistos.add(k); });
    return cs;
  }
  function mesmosNomes(a, b) { return [0, 1, 2].every(function (k) { return nomeKey((a || [])[k]) === nomeKey((b || [])[k]); }); }
  function contadoresInv(inv) { return Array.isArray(inv.contadores) ? [0, 1, 2].map(function (k) { return txt(inv.contadores[k], 80); }) : ['', '', '']; }
  /** Etapa liberada: inventário sem o campo (backup de antes da v2) tem as três liberadas, como funcionava. */
  function liberada(inv) { return etapaOk(inv.etapaLiberada) ? inv.etapaLiberada : 3; }
  /** Regra de encerramento: 2 = v2 (2ª = 1ª encerra); sem o campo = 1, a de antes (2ª = 1ª ≠ saldo vai à 3ª). */
  function regraDe(inv) { return inv && inv.regra === 2 ? 2 : 1; }

  /* ---------------------------------------------------------------- site e depósito com grafias diferentes */
  /** Chave de comparação de site/depósito: sem acento, maiúsculas, espaços das pontas fora e repetidos viram um. Hífen, sublinhado e
   *  espaço continuam diferentes ("AL-01", "AL_01" e "AL 01" são três depósitos), igual ao importador. */
  function chaveLocal(v) { return String(v == null ? '' : v).normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase().replace(/\s+/g, ' ').trim(); }
  /** chaveLocal → grafia a exibir: a mais frequente entre as posições (empate: a primeira em ordem alfabética). */
  function grafias(ps, campo) {
    var cont = new Map(), out = new Map();
    ps.forEach(function (p) { var t = String(p[campo] == null ? '' : p[campo]), k = chaveLocal(t); if (!cont.has(k)) cont.set(k, new Map()); var m = cont.get(k); m.set(t, (m.get(t) || 0) + 1); });
    cont.forEach(function (m, k) { var melhor = '', n = -1; Array.from(m.keys()).sort().forEach(function (t) { if (m.get(t) > n) { melhor = t; n = m.get(t); } }); out.set(k, melhor); });
    return out;
  }
  /** undefined/null = sem filtro; texto ou lista = só esses valores ('' explícito = as linhas sem site/depósito); lista vazia = nenhuma. */
  function filtroLocal(v) { return v == null ? null : new Set((Array.isArray(v) ? v : [v]).map(chaveLocal)); }
  /**
   * Filtro Site + Depósito da importação (a Lista disponível traz depósitos que não são do almoxarifado). site/deposito: texto ou
   * lista de textos; ausente (undefined/null) = todos; vazio explícito ('' ou ['', 'D1']) seleciona as linhas sem site/depósito,
   * como a opção vazia de sitesDepositos. Compara pela chaveLocal. Devolve as mesmas linhas (sem copiar), na ordem.
   */
  function filtrarSiteDeposito(linhas, filtro) {
    filtro = filtro || {};
    var s = filtroLocal(filtro.site), d = filtroLocal(filtro.deposito);
    return (linhas || []).filter(function (l) { return (!s || s.has(chaveLocal(l.site))) && (!d || d.has(chaveLocal(l.deposito))); });
  }
  /** Sites e depósitos das linhas para o filtro: [{ site, deposito, posicoes, grafias: [textos originais] }], grafia mais frequente. */
  function sitesDepositos(linhas) {
    linhas = linhas || [];
    var gs = grafias(linhas, 'site'), gd = grafias(linhas, 'deposito'), m = new Map();
    linhas.forEach(function (l) {
      var k = chaveLocal(l.site) + '\u0000' + chaveLocal(l.deposito);
      if (!m.has(k)) m.set(k, { site: gs.get(chaveLocal(l.site)), deposito: gd.get(chaveLocal(l.deposito)), posicoes: 0, grafias: new Set() });
      var x = m.get(k); x.posicoes++; x.grafias.add(String(l.deposito == null ? '' : l.deposito));
    });
    return Array.from(m.values()).map(function (x) { return { site: x.site, deposito: x.deposito, posicoes: x.posicoes, grafias: Array.from(x.grafias).sort() }; })
      .sort(function (a, b) { return (a.site + '\u0000' + a.deposito).localeCompare(b.site + '\u0000' + b.deposito, 'pt-BR', { numeric: true }); });
  }

  /* ---------------------------------------------------------------- custo financeiro obrigatório (21/10/2026)
   * O motor faz o papel do servidor: a tela não contorna. Inventário criado nesta versão tem inv.regraCusto = 1 (cópia em
   * base.resumo.regraCusto, que as versões anteriores do arquivo guardam): criar, selecionar, dividir, iniciar, aplicarBaixas e o
   * validarInventario recusam posição sem precoUnitario válido (null, vazio, NaN, negativo). Inventário antigo (sem a marca) continua
   * abrindo e funcionando como antes; semCusto(inv) lista as posições dele sem custo para a tela avisar. */
  function exigeCustoDe(inv) { return !!inv && inv.regraCusto === 1; }
  function custoOk(v) { return (typeof v === 'string' || typeof v === 'number') && decimalOk(v, false) != null; }
  function exemplosPos(ps) { return ps.slice(0, 3).map(function (p) { return txt(p && p.codigo, 40) + ' em ' + txt(p && p.localizacao, 60); }).join(', ') + (ps.length > 3 ? '…' : ''); }
  var CORRIJA_CUSTO = 'O custo financeiro é obrigatório: corrija na Lista disponível (Dynamics) ou na planilha modelo e importe de novo.';
  /** Lança se o inventário exige custo e alguma das posições não tem custo válido. acao: começo da mensagem ("Seleção recusada"). */
  function exigeCusto(inv, ps, acao) {
    if (!exigeCustoDe(inv)) return;
    var sem = (ps || []).filter(function (p) { return !custoOk(p.precoUnitario); });
    if (sem.length) throw erro(acao + ': ' + pl(sem.length, 'posição', 'posições') + ' sem custo financeiro válido (' + exemplosPos(sem) + '). ' + CORRIJA_CUSTO);
  }
  /** Posições sem custo válido (no escopo e fora), na ordem da posição: [{ id, codigo, descricao, site, deposito, localizacao,
   *  foraDoEscopo }]. Num inventário desta versão (regraCusto) é sempre []; num antigo, a tela usa para avisar. */
  function semCusto(inv) {
    var dentro = new Set((inv.posicoes || []).map(function (p) { return p.id; }));
    return todasPosicoes(inv).filter(function (p) { return !custoOk(p.precoUnitario); }).sort(compararPosicao).map(function (p) {
      return { id: p.id, codigo: p.codigo, descricao: p.descricao, site: p.site, deposito: p.deposito, localizacao: p.localizacao, foraDoEscopo: !dentro.has(p.id) };
    });
  }
  var MOTIVO_CURTO = { vazio: 'vazio', invalido: 'inválido', negativo: 'negativo', ambiguo: 'ambíguo', indefinido: 'indefinido', repetida: 'repetidas' };
  function inteiro(v) { return Number.isInteger(v) && v >= 0 && v < 100000000 ? v : 0; }
  /**
   * Resultado da importação guardado no inventário (inv.base.importacao, cópia em base.resumo.importacao): { arquivo, recebidas,
   * aceitas, rejeitadas, porMotivo: { motivo: n }, coluna, em, por }. Vem de base.resumo.validacaoCusto (IMP.parse); base montada sem
   * o importador: tudo aceito. Também normaliza a que vem de arquivo (só inteiros, texto limitado, chaves conhecidas).
   */
  function importacaoOk(x) {
    if (!objeto(x)) return null;
    var pm = {};
    if (objeto(x.porMotivo)) Object.keys(MOTIVO_CURTO).forEach(function (k) { if (Object.prototype.hasOwnProperty.call(x.porMotivo, k)) pm[k] = inteiro(x.porMotivo[k]); });
    var o = { arquivo: texto(x.arquivo, 200), recebidas: inteiro(x.recebidas), aceitas: inteiro(x.aceitas), rejeitadas: inteiro(x.rejeitadas), porMotivo: pm,
      coluna: texto(x.coluna, 120), em: dataIso(x.em), por: texto(x.por, 80) };
    if (inteiro(x.semCustoNoCriar)) o.semCustoNoCriar = inteiro(x.semCustoNoCriar);
    return o;
  }
  /** semCusto: posições aceitas na importação que a junção do criar deixou sem custo (pendência 'sem_custo'): saem de aceitas e ficam
   *  registradas em semCustoNoCriar (só quando há). */
  function importacaoDe(base, meta, por, agora, semCusto) {
    var vc = objeto(base.resumo) && objeto(base.resumo.validacaoCusto) ? base.resumo.validacaoCusto : null, n = base.lines.length;
    return importacaoOk({ arquivo: txt(meta.arquivo, 200), recebidas: vc ? vc.recebidas : n, aceitas: Math.max(0, (vc ? vc.aceitas : n) - (semCusto || 0)), rejeitadas: vc ? vc.rejeitadas : 0,
      porMotivo: vc && objeto(vc.porMotivo) ? vc.porMotivo : {}, coluna: vc ? vc.coluna : '', em: agoraIso(agora), por: por, semCustoNoCriar: semCusto || 0 });
  }
  /** "12 de 15 posições aceitas · 3 rejeitadas por custo (vazio 2 · negativo 1) · coluna Valor de custo financeiro · arquivo X" (histórico e tela). */
  function importacaoTexto(x) {
    var m = importacaoOk(x); if (!m) return '';
    var mot = Object.keys(m.porMotivo).filter(function (k) { return m.porMotivo[k] > 0; }).map(function (k) { return MOTIVO_CURTO[k] + ' ' + m.porMotivo[k]; });
    return m.aceitas + ' de ' + pl(m.recebidas, 'posição aceita', 'posições aceitas') + ' · ' + (m.rejeitadas ? pl(m.rejeitadas, 'rejeitada', 'rejeitadas') + ' por custo' +
      (mot.length ? ' (' + mot.join(' · ') + ')' : '') : 'nenhuma rejeitada por custo') +
      (m.semCustoNoCriar ? ' · ' + m.semCustoNoCriar + ' sem custo da soma na junção (pendência)' : '') + (m.coluna ? ' · coluna ' + m.coluna : '') + (m.arquivo ? ' · ' + m.arquivo : '');
  }

  /* ---------------------------------------------------------------- criar e dividir */
  /** Chave da posição na Lista disponível (para escolher o escopo sem depender do id gerado aqui). */
  function chave(p) { return [p.codigo, p.site, p.deposito, p.localizacao, p.lote || '', p.serie || ''].join('|'); }
  /** Conjunto de escolha: ids ("p00001") ou chaves (código|site|depósito|localização|lote|série). */
  function escolha(lista) {
    var s = new Set();
    (Array.isArray(lista) ? lista : []).forEach(function (x) { if (typeof x === 'string' && x) s.add(x); });
    return function (p) { return s.has(p.id) || s.has(chave(p)); };
  }
  /** Ordem original da Lista disponível (id p00001, p00002…; numérico, para passar de 99999). */
  function porId(a, b) { return a.id.localeCompare(b.id, 'en', { numeric: true }); }
  var NATURAL = typeof Intl === 'object' && Intl.Collator ? new Intl.Collator('pt-BR', { numeric: true, sensitivity: 'base' }) : null;
  function natural(a, b) { a = String(a == null ? '' : a); b = String(b == null ? '' : b); return NATURAL ? NATURAL.compare(a, b) : a < b ? -1 : a > b ? 1 : 0; }
  /**
   * A ordem das posições em todo lugar (tela, planilha do contador, folha cega, Excel e PDF): site, depósito, depois localização em
   * ordem natural pt-BR (01-2 antes de 01-10; sem caixa nem acento), depois código e por fim o id. Uma ordem só: quem cola só a coluna
   * de quantidades da planilha na tela cai na mesma linha. O site vem antes do depósito: dois sites com o mesmo depósito não se
   * intercalam (a folha cega abre um bloco por site/depósito). a, b: posição, linha do relatório ou do pacote ({ site, deposito, localizacao, codigo, id }).
   */
  function compararPosicao(a, b) {
    return natural(a.site, b.site) || natural(a.deposito, b.deposito) || natural(a.localizacao, b.localizacao) || natural(a.codigo, b.codigo) ||
      String(a.id == null ? '' : a.id).localeCompare(String(b.id == null ? '' : b.id), 'en', { numeric: true });
  }

  /**
   * base = resultado de BiotropInventarioImport.parse() (Lista disponível ou planilha modelo);
   * meta = { nome, responsavel, arquivo, hash, exportadoEm, fonte, incluir, site, deposito, camm, tipoInventario, materialInventariar,
   *   contadores: [1ª, 2ª, 3ª], divisao }. tipoInventario: id de TIPOS_INVENTARIO, obrigatório; materialInventariar: texto livre, opcional.
   * Custo obrigatório: linha sem precoUnitario válido recusa o criar inteiro (erro, não ignora); linhas que a junção abaixo deixaria
   * com custo indefinido viram pendência (tipo 'sem_custo'). O inventário sai com regraCusto = 1, base.importacao (importacaoDe) e o
   * histórico "importacao".
   * meta.incluir (opcional): ids ou chaves das posições a inventariar; sem ele, tudo entra. As outras ficam em inv.foraDoEscopo.
   * meta.site/meta.deposito: cabeçalho do inventário; preenchem a posição que veio sem site/depósito (planilha modelo sem as colunas).
   * Depois disso, linhas que viraram a mesma posição pelo preenchimento são juntadas, cada lado do escopo por si: juntarRepetidas.
   * Sem meta.divisao ({ criterio, opcoes }), uma lista única cujos contadores espelham inv.contadores.
   * base.resumo do inventário = o da importação + regra (2, cópia de inv.regra que o HTML v1 preserva), juntadasNoCriar, mesmaPosicao
   * e as cópias de copiaNoResumo (cabecalho, espelha, descricoesLongas).
   */
  function criar(base, meta, agora) {
    meta = meta || {};
    if (!base || !Array.isArray(base.lines) || !base.lines.length) throw erro('A lista do Dynamics não tem posições para contar.');
    if (!txt(meta.nome)) throw erro('Dê um nome ao inventário.');
    if (!txt(meta.responsavel)) throw erro('Informe o responsável pelo inventário.');
    if (!txt(meta.camm)) throw erro('Informe o CAMM do inventário.');
    // como definirCabecalho: tipo que não é texto (["anual"], objeto…) é recusado, não convertido
    var tipo = exigeTipo(typeof meta.tipoInventario === 'string' ? txt(meta.tipoInventario, LIM_CAB.tipoInventario) : '');
    // custo obrigatório: a posição sem custo válido nem entra (a importação já rejeita; aqui vale também para a tela que mandar assim)
    var semC = base.lines.filter(function (l) { return !objeto(l) || !custoOk(l.precoUnitario); });
    if (semC.length) throw erro('Inventário não criado: ' + pl(semC.length, 'posição', 'posições') + ' sem custo financeiro válido (' + exemplosPos(semC) + '). ' + CORRIJA_CUSTO);
    var site = txt(meta.site, 60), deposito = txt(meta.deposito, 60), contadores = nomes(meta.contadores, 'do inventário');
    var n = 0;
    var todas = base.lines.map(function (l) {
      n++;
      var p = { id: 'p' + String(n).padStart(5, '0'), codigo: txt(l.codigo, 40), descricao: txt(l.descricao, 300), descricaoLonga: txt(l.descricaoLonga, 1000), unidade: txt(l.unidade, 20),
        site: txt(l.site, 60) || site, deposito: txt(l.deposito, 60) || deposito, localizacao: txt(l.localizacao, 60), lote: txt(l.lote, 60), serie: txt(l.serie, 60),
        saldo: calc.decimal(String(l.saldo)), precoUnitario: l.precoUnitario == null ? null : calc.decimal(String(l.precoUnitario), false), lista: '', _linha: l._linha };
      // chave do importador (código, site/depósito pela chaveLocal, localização, lote, série, configuração, status, extras) já com o
      // site/depósito do cabeçalho: só o preenchimento pode repetir uma chave que o importador não somou
      p._chave = chaveRepetida(Object.assign({}, l, { site: p.site, deposito: p.deposito }));
      return p;
    });
    var j = juntarRepetidas(todas, Array.isArray(meta.incluir) ? escolha(meta.incluir) : function () { return true; });
    todas = j.todas;
    todas.forEach(function (p) { delete p._linha; delete p._chave; });
    var posicoes = todas.filter(j.dentro), fora = todas.filter(function (p) { return !j.dentro(p); });
    if (!posicoes.length) throw erro('Escolha pelo menos uma posição para o inventário.');
    var resumo = Object.assign({}, base.resumo || {});
    resumo.regra = 2;
    if (j.juntadas) resumo.juntadasNoCriar = j.juntadas;
    if (j.mesmaPosicao.length) resumo.mesmaPosicao = j.mesmaPosicao;
    var inv = { formato: FORMATO, versao: VERSAO, id: id('inv'), nome: txt(meta.nome, 120), responsavel: txt(meta.responsavel, 80),
      criadoEm: agoraIso(agora), estado: 'preparacao', site: site, deposito: deposito, camm: txt(meta.camm, 120),
      tipoInventario: tipo, materialInventariar: txt(meta.materialInventariar, LIM_CAB.materialInventariar), contadores: contadores, etapaLiberada: 1, regra: 2, regraCusto: 1,
      base: { arquivo: txt(meta.arquivo, 200), hash: txt(meta.hash, 80), exportadoEm: dataIso(meta.exportadoEm), fonte: txt(meta.fonte, 80),
        resumo: resumo, pendencias: (base.pendencias || []).concat(j.pendencias).slice(0, 5000) },
      posicoes: posicoes, foraDoEscopo: fora, listas: [], contagens: [], justificativas: {}, aprovacao: null, historico: [] };
    inv.base.importacao = importacaoDe(base, meta, inv.responsavel, agora, j.pendencias.filter(function (x) { return x.tipo === 'sem_custo'; }).length);
    hist(inv, inv.responsavel, 'criado', pl(posicoes.length, 'posição', 'posições') + ' de ' + (inv.base.arquivo || 'arquivo do Dynamics') +
      (fora.length ? ' (escopo: ' + posicoes.length + ' de ' + todas.length + ')' : '') + ' · tipo ' + tipoTexto(tipo), agora);
    hist(inv, inv.responsavel, 'importacao', importacaoTexto(inv.base.importacao), agora);
    if (j.avisos.length) hist(inv, inv.responsavel, 'juntadas', j.avisos.length + (j.avisos.length === 1 ? ' posição repetida juntada: ' : ' posições repetidas juntadas: ') + j.avisos.join('; '), agora);
    if (j.separadas.length) hist(inv, inv.responsavel, 'separadas', j.separadas.join('; '), agora);
    exigeCusto(inv, todas, 'Inventário não criado');   // as juntadas sem custo da soma viraram pendência; nada sem custo passa daqui
    if (meta.divisao && meta.divisao.criterio && meta.divisao.criterio !== 'unica') dividir(inv, meta.divisao.criterio, meta.divisao.opcoes, agora);
    else {
      // sem divisão pedida: uma lista só, com os contadores do cabeçalho (sem histórico "listas": não houve escolha)
      inv.listas = [{ id: 'L001', nome: CRITERIOS.unica(), contadores: contadores.slice(), espelha: true }];
      posicoes.forEach(function (p) { p.lista = 'L001'; });
      inv.divisao = { criterio: 'unica' };
    }
    copiaNoResumo(inv, true);
    return inv;
  }

  /**
   * Cópias em base.resumo dos campos da v2 que o HTML v1 apaga ao abrir (ele guarda o resumo inteiro), como base.resumo.regra:
   *   cabecalho: { camm, site, deposito, contadores: [1ª, 2ª, 3ª], tipoInventario?, materialInventariar? (REG.0715, só quando
   *   preenchidos) } · reg0715: { tipoInventario?, materialInventariar? } (os mesmos dois; some quando os dois estão vazios), porque a
   *   versão publicada 51633c3 reescreve cabecalho sem eles, mas preserva as chaves do resumo que não conhece · espelha: [ids das listas com lista.espelha] · baixas: cópia de inv.baixas, a lista de RM/EM (só quando há; o
   *   validar casa de novo as linhas com as posições, que perderam p.baixas no v1) ·
   *   descricoesLongas: { posId: texto } — só as não vazias (posições no escopo e fora, na ordem do id), até LIMITE_LONGAS caracteres
   *   somados: passou disso, as seguintes ficam sem cópia (só a ida e volta pelo v1 as perderia).
   * Chamada por quem muda esses campos (criar, selecionar, dividir, definirContadores*, definirCabecalho, aplicarBaixas, gerarEtapa,
   * iniciar) e no fim do validarInventario (que também troca uma cópia vinda do arquivo pela recalculada). longas = refazer
   * descricoesLongas: o texto só nasce no criar e chega no validar; o escopo não muda os ids. Troca o objeto do resumo (não altera o da importação).
   */
  var LIMITE_LONGAS = 1000000;
  /** Tamanho máximo dos textos do cabeçalho da REG.0715. */
  var LIM_CAB = { tipoInventario: 60, materialInventariar: 200, camm: 120 };
  function copiaNoResumo(inv, longas) {
    if (!objeto(inv.base)) return;
    var r = Object.assign({}, objeto(inv.base.resumo) ? inv.base.resumo : {});
    r.cabecalho = { camm: txt(inv.camm, 120), site: txt(inv.site, 60), deposito: txt(inv.deposito, 60), contadores: contadoresInv(inv) };
    // REG.0715: só quando preenchidos (a cópia de quem não usa fica como era). Duas cópias: em cabecalho (o v1 guarda o resumo inteiro)
    // e em reg0715, que a versão publicada 51633c3 não reescreve — ela refaz cabecalho só com camm/site/depósito/contadores e apaga estes
    var reg = {};
    ['tipoInventario', 'materialInventariar'].forEach(function (k) { var v = txt(inv[k], LIM_CAB[k]); if (v) { r.cabecalho[k] = v; reg[k] = v; } });
    if (Object.keys(reg).length) r.reg0715 = reg; else delete r.reg0715;
    if (objeto(inv.baixas)) r.baixas = JSON.parse(JSON.stringify(inv.baixas)); else delete r.baixas;
    // custo obrigatório e resultado da importação (21/10): as versões anteriores apagam inv.regraCusto e base.importacao, mas guardam o resumo
    if (exigeCustoDe(inv)) r.regraCusto = 1; else delete r.regraCusto;
    if (objeto(inv.base.importacao)) r.importacao = importacaoOk(inv.base.importacao); else delete r.importacao;
    // divisão por prateleira/nível (21/10): as versões anteriores não conhecem o critério e apagam inv.divisao (o selecionar deixaria de
    // refazer as listas por ele); os critérios que elas conhecem não precisam de cópia (backup igual ao de antes)
    if (objeto(inv.divisao) && CRITERIOS_NOVOS[inv.divisao.criterio] === true) r.divisao = { criterio: inv.divisao.criterio }; else delete r.divisao;
    r.espelha = (inv.listas || []).filter(function (l) { return l.espelha === true; }).map(function (l) { return l.id; });
    if (longas) {
      var d = {}, total = 0, n = 0;

  /* ================================================================ planilha modelo de importação (base do inventário)

  // As colunas vêm do importador (IMP.MODELO_COLUNAS: { campo, titulo, obrigatoria, ajuda }, web/src/almox/inventario-import.js), que

  /** Colunas do modelo: { h (título; obrigatória termina em "*"), obrigatoria, ajuda }. Aceita texto com "*" ou objeto { titulo|h|nome, obrigatoria }. */

  }
  // O que vai em cada coluna e 3 exemplos fictícios (texto: mostram o formato, não são importados)

 *                               observações em branco (nunca saldo, esperado, baixa RM/EM nem contagem anterior); a coluna da etapa
 *                               do pacote vem destacada. Depois o quadro de itens achados fora da lista e as assinaturas
 *   final(BP, inv, rel)       → desde 23/10/2026, a aba "Resumo A4" do Excel (planilhas.js, resumoA4; com o logo) desenhada em HTML, célula por
 *                               célula: o PDF final e o Excel saem iguais (mesmo modelo do Felipe, mesmos dados, mesmos 5 gráficos).
 *                               Ver "relatório final = a aba Resumo A4" mais abaixo
 *   op.inv (só na folha): o inventário de onde saiu o pacote (tela do responsável): tipo/material/CAMM e DATA (criação) saem dele;
 *                               sem op.inv (aparelho do contador), saem do pacote (M.pacote: tipoInventario, materialInventariar, camm,
 *                               inventarioCriadoEm); pacote antigo sem os campos: em branco e a DATA da geração do pacote.

 * Devolvem o HTML do documento; a tela abre a impressão (BiotropPrint.imprimir). Classes próprias com prefixo ivr- (a ficha: ivr-reg-;

  /* ============================================================ armazenamento (IndexedDB; sem ele, só nesta aba) */

    'exportar-contagens': function (b, revisado) {

      var vai = function () { baixarJson(nomeArq(S.pac, 'json'), arq); aviso('Arquivo de contagens baixado: mande para ' + S.pac.responsavel + '. A contagem continua salva neste aparelho.'); };
      if (falta && !revisado) confirmar('Enviar contagens', (falta === 1 ? '1 posição está sem quantidade (não contada).' : num(falta) + ' posições estão sem quantidade (não contadas).') + ' Enviar assim mesmo?', 'Enviar', vai); else vai();
    },
    'importar-json': function () {
      escolherArquivo('.json', function (f) {
        lerJson(f).then(function (arq) {
          return salvarInv(function (inv) { return M.importarContagens(inv, arq); }).then(function (r) {
            var fim = depoisDeLancar(); desenhar();
            janela('Contagens recebidas', arq && arq.contador ? 'de ' + String(arq.contador) : '', '<p><b>' + r.aplicadas + '</b> lançadas' + (r.repetidas ? ', ' + r.repetidas + ' já estavam lançadas' : '') + (r.erros.length ? ', <b>' + r.erros.length + '</b> recusadas:' : '.') + '</p>' +
              (r.erros.length ? '<ul class="inv-hist inv-hist--ruim">' + r.erros.slice(0, 80).map(function (e) { return '<li>' + h(e.codigo) + ' — ' + h(e.motivo) + '</li>'; }).join('') + '</ul>' : '') +
              // correção reenviada: a mesma pessoa e etapa já lançada com outro valor; o responsável decide, nada é trocado sozinho
              (r.conflitos.length ? '<p><b>' + r.conflitos.length + '</b> com valor diferente do já lançado (não substituídas):</p><ul class="inv-hist inv-hist--ruim">' + r.conflitos.slice(0, 80).map(function (c) {
                return '<li>' + h(c.codigo) + ' — não substituído: valor já lançado ' + h(qty(c.lancado)) + ', arquivo traz ' + h(qty(c.novo)) + '</li>'; }).join('') + '</ul>' : '') +
              (fim ? '<p class="inv-ok">' + h(fim.trim()) + '</p>' : ''));
          });
        }).catch(function (e) { aviso(e.message, true); });
      });
    },
    'importar-planilha': function () { escolherEtapa('De quem é esta contagem?', 'Planilha preenchida ou colar do Excel', 'Continuar', function (o) { colar({ inv: true, pac: pacoteDe(o.l.id, o.quem) }); }); },
    // contar
    colar: function () { colar(S.pac); },
    'modelo-pac': function () { planilha(nomeArq(S.pac, 'xlsx', 'planilha'), P.modelo(X, S.pac)).then(function () { aviso('Planilha baixada.'); }, function (e) { aviso(e.message, true); }); },
    'folha-pac': function () { BP.imprimir('Folha ' + S.pac.lista.nome, R.folha(BP, S.pac), function (e) { aviso('Não consegui abrir a impressão: ' + e.message, true); }); },
    'cont-so': function (b) { S.cont.so = b.dataset.v || ''; desenhar(); },
    'limpar-rasc': function () {
      confirmar('Limpar preenchidas', 'Apagar as quantidades digitadas/coladas nesta contagem?', 'Limpar', function () {
        var ids = Object.keys(S.pac.contagens); S.pac.contagens = {};
        salvarPac(function (p) { ids.forEach(function (k) { delete p.contagens[k]; }); }); desenhar();
      }, true);
    },
    // relatórios
    cpag: function (b) { S.acomp.pagina = Math.max(1, S.acomp.pagina + Number(b.dataset.p)); desenhar(); },
    justificar: function (b) { justificar(b.dataset.id); },
    'justificar-todas': function () { justificarTodas(); },
    aprovar: aprovar,
    excel: function () { var rel = M.relatorio(S.inv); planilha('inventario-' + slug(S.inv.nome) + '.xlsx', P.exportar(X, S.inv, rel)).then(function () { aviso('Planilha Excel baixada.'); }, function (e) { aviso(e.message, true); }); },
    pdf: function () { BP.imprimir('Inventário ' + S.inv.nome, R.final(BP, S.inv, M.relatorio(S.inv)), function (e) { aviso('Não consegui abrir a impressão: ' + ((e && e.message) || ''), true); }); },
    bi: function (b) {
      var invs = b.dataset.id ? S.invs.filter(function (x) { return x.id === b.dataset.id; }) : S.invs.filter(function (x) { return x.estado !== 'preparacao'; });
      if (!invs.length) return aviso('Nenhum inventário com contagem neste aparelho para exportar.', true);
      var gera = P.powerBi || P.powerbi;
      if (typeof gera !== 'function') return aviso('A base do Power BI ainda não está disponível nesta versão do arquivo.', true);
      // a base do Power BI é de um inventário (P.powerBi(X, inv, rel)); com vários no aparelho, pergunta qual
      var exporta = function (inv) {
        try { planilha('biotrop-inventario-' + slug(inv.nome) + '-powerbi.xlsx', gera(X, inv, M.relatorio(inv))).then(function () { aviso('Planilha do Power BI baixada.'); }, function (e) { aviso(e.message, true); }); }
        catch (e) { aviso(e.message, true); }
      };
      if (invs.length === 1) return exporta(invs[0]);
      var j = janela('Exportar para Power BI', 'Base de um inventário, para atualizar o painel', '<label class="pcm-field"><span class="pcm-label">Inventário</span><select class="pcm-input" data-sel-inv>' +
        invs.map(function (x, i) { return '<option value="' + i + '">' + h(x.nome) + ' · ' + situacaoInv(x)[0] + '</option>'; }).join('') + '</select></label>',
        '<button type="button" class="pcm-btn" data-fechar>Cancelar</button><button type="button" class="pcm-btn pcm-btn--primary" data-ok>' + ic(IC.bi, 16) + ' Exportar</button>');
      j.querySelector('[data-ok]').onclick = function () { var inv = invs[Number((j.querySelector('[data-sel-inv]') || {}).value) || 0]; j.fechar(); exporta(inv); };
    }
  };

  /* ============================================================ eventos */
  function mudarSel(t) {
    var s = selAtual(); if (!s) return;
    marcar(s, t.dataset.sel, !!t.checked);
    var tr = t.closest && t.closest('tr'); if (tr && tr.classList) tr.classList.toggle('is-sel', !!t.checked);
    atualizarSelbar(s);
  }
  // campos do cabeçalho do novo inventário (data-novo): só estes nomes viram estado
  var CAMPOS_NOVO = { nome: 1, responsavel: 1, site: 1, deposito: 1, camm: 1, tipoInventario: 1, materialInventariar: 1, criterio: 1, tamanho: 1, c1: 1, c2: 1, c3: 1 };
  function campoNovo(t) {
    var f = t.dataset.novo, st = novo();
    if (!Object.prototype.hasOwnProperty.call(CAMPOS_NOVO, f)) return;
    if (/^c[123]$/.test(f)) st.c[Number(f[1]) - 1] = t.value; else st[f] = t.value;
  }
  /** Passo 2: o tipo escolhido no resumo ao lado, sem redesenhar. */
  function resumoTipoNovo() {
    var x = raiz.querySelector('[data-resumo-tipo]'), tipo = tipoDaLista(novo().tipoInventario);
    if (x) x.innerHTML = 'Tipo: ' + (tipo ? '<b>' + h(tipo.nome) + '</b>' : '<b class="inv-falta">escolha o tipo de inventário</b>');
  }
  /** Prévia de quantas listas saem: no passo 2 (com o tamanho digitado) e na aba Listas (critério e tamanho da tela), sem redesenhar. */
  function previaNovo() {
    var x = raiz.querySelector('[data-div-previa]'), st = novo();
    if (x) x.textContent = previaDivisaoTxt(previaDivisao(escolhidasNovo(st).map(function (y) { return y.l; }), st.criterio, st.tamanho, null, st.deposito));
  }
  function previaListas() {
    var x = raiz.querySelector('[data-div-previa]'); if (!x || !S.inv) return;
    x.textContent = previaDivisaoTxt(previaDivisao(S.inv.posicoes, S.criterio, S.tamanho, S.inv));
  }
  raiz.addEventListener('click', function (e) {
    var b = e.target.closest('[data-a]');
    if (b && !b.disabled && Object.prototype.hasOwnProperty.call(ACOES, b.dataset.a)) { if (e.preventDefault) e.preventDefault(); ACOES[b.dataset.a](b); return; }
    var t = e.target.closest('[data-aba]'); if (t && S.inv) mudarAbaInv(t.dataset.aba);
  });
  raiz.addEventListener('change', function (e) {
    var t = e.target;
    if (t.matches('[data-qtd]')) return anotar(t.dataset.qtd, String(t.value || '').trim(), t);
    if (t.matches('[data-sel]')) return mudarSel(t);
    if (t.matches('select[data-cpos]')) { S.cont.pos = t.value || ''; S.cont.prat = ''; S.cont.niv = ''; return desenhar(); }
    if (t.matches('select[data-cprat]')) { S.cont.prat = t.value || ''; S.cont.niv = ''; return desenhar(); }
    if (t.matches('select[data-cniv]')) { S.cont.niv = t.value || ''; return desenhar(); }
    if (t.matches('select[data-ftipo]')) { S.filtroTipo = t.value || ''; return desenhar(); }
    if (t.matches('select[data-cord]') || t.matches('select[data-rord]')) {
      var est = t.matches('select[data-rord]') ? S.res : S.cont, o = String(t.value || '').split('|');
      if (Object.prototype.hasOwnProperty.call(ORD_OK, o[0])) { est.ord = o[0]; est.dir = o[1] === '-1' ? -1 : 1; if (est === S.res) est.pagina = 1; }
      return desenhar();
    }
    if (t.matches('select[data-f]')) {
      var s = selAtual(); if (!s) return;
      s.f[t.dataset.f] = t.value; s.pagina = 1;
      // corredor → prateleira → nível: trocar um de cima solta os de baixo (a prateleira de outro corredor não fica valendo)
      if (t.dataset.f === 'corredor') { s.f.prateleira = ''; s.f.nivel = ''; } else if (t.dataset.f === 'prateleira') s.f.nivel = '';
      return desenhar();
    }
    if (t.matches('select[data-cf]')) { S.acomp.f[t.dataset.cf] = t.value; S.acomp.pagina = 1; return desenhar(); }
    if (t.matches('select[data-rf]')) { S.res.so = t.value || ''; S.res.pagina = 1; return desenhar(); }
    if (t.matches('[data-imp-repetir]')) { novo().repetir = t.checked; return desenhar(); }
    if (t.matches('[data-cfg]')) { var st = novo(), k = t.dataset.cfg; st.opts[k] = k === 'headerRow' ? Number(t.value) || undefined : t.value; if (k === 'sheet') { delete st.opts.headerRow; delete st.opts.mapping; } return impAnalisar(); }
    if (t.matches('[data-map]')) { var s2 = novo(), lida = s2.res || s2.erroInfo; s2.opts.mapping = Object.assign({}, lida && lida.mapping || {}, s2.opts.mapping || {}); s2.opts.mapping[t.dataset.map] = t.value === '' ? -1 : Number(t.value); return impAnalisar(); }
    if (t.matches('[data-novo]')) {
      campoNovo(t);
      if (t.dataset.novo === 'criterio') desenhar();
      // tipo e tamanho não redesenham (o foco fica no rádio/campo): só o resumo e a prévia mudam
      else if (t.dataset.novo === 'tipoInventario') resumoTipoNovo();
      else if (t.dataset.novo === 'tamanho') previaNovo();
      return;
    }
    if (t.matches('[data-campo="criterio"]')) { S.criterio = t.value; var tam = raiz.querySelector('[data-campo-tamanho]'); if (tam) tam.hidden = t.value !== 'tamanho'; previaListas(); return; }
    if (t.matches('[data-campo="tamanho"]')) { S.tamanho = t.value; previaListas(); return; }
  });
  var timer = null;
  /** Filtro de texto: espera parar de digitar, redesenha e devolve o foco ao mesmo campo. */
  function filtrarDepois(sel, aplica, pos) {
    clearTimeout(timer);
    timer = setTimeout(function () { aplica(); desenhar(); var n = raiz.querySelector(sel); if (n && n.focus) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (er) { /* ok */ } } }, 220);
  }
  raiz.addEventListener('input', function (e) {
    var t = e.target;
    if (t.matches('input[data-f]')) { var s = selAtual(), k = t.dataset.f; if (s) filtrarDepois('input[data-f="' + k + '"]', function () { s.f[k] = t.value; s.pagina = 1; }, t.selectionStart); return; }
    if (t.matches('input[data-cf]')) { filtrarDepois('input[data-cf]', function () { S.acomp.f.q = t.value; S.acomp.pagina = 1; }, t.selectionStart); return; }
    if (t.matches('input[data-rf]')) { filtrarDepois('input[data-rf]', function () { S.res.q = t.value; S.res.pagina = 1; }, t.selectionStart); return; }
    if (t.matches('[data-novo]')) campoNovo(t);
  });
  raiz.addEventListener('keydown', function (e) {
    var t = e.target;
    if (t.matches('[data-scan]') && e.key === 'Enter') {
      e.preventDefault(); var v = String(t.value || '').trim();
      if (!v) { S.cont.q = ''; return desenhar(); }
      var exato = S.pac.posicoes.some(function (x) { return x.codigo.toUpperCase() === v.toUpperCase() || x.id.toUpperCase() === v.toUpperCase(); });
      if (exato) { t.value = ''; lido(v); } else { S.cont.q = v; desenhar(); }
      return;
    }
    if (t.matches('[data-qtd]') && (e.key === 'Enter' || e.key === 'ArrowDown' || e.key === 'ArrowUp')) {
      e.preventDefault();
      if (e.key === 'Enter') anotar(t.dataset.qtd, String(t.value || '').trim(), t);
      var todos = Array.prototype.slice.call(raiz.querySelectorAll('[data-qtd]')), i = todos.indexOf(t), alvo = todos[i + (e.key === 'ArrowUp' ? -1 : 1)];
      if (alvo) { alvo.focus(); alvo.select(); } else if (e.key === 'Enter') { var s = raiz.querySelector('[data-scan]'); if (s) s.focus(); }
    }
  });
  /**
   * Campo de quantidade focado (toque, Enter, setas, leitor) nunca fica atrás da barra fixa "Revisar e confirmar". O CSS já rola com
   * scroll-margin; isto cobre o que ele não alcança (teclado do celular encolhendo a tela, focus() de navegador antigo). Depois da
   * rolagem do próprio navegador (setTimeout 0), mede e rola só a diferença.
   */
  function acimaDaBarra(inp) {
    var barra = raiz.querySelector('.inv-confirma');
    if (!barra || !inp.getBoundingClientRect || !barra.getBoundingClientRect || typeof window.scrollBy !== 'function') return 0;
    var r = inp.getBoundingClientRect(), b = barra.getBoundingClientRect(), d = r.bottom + 12 - b.top;
    // campo já acima da barra (inclusive no fim da lista, quando ela está no fluxo, abaixo de todas as linhas): nada a fazer
    if (d <= 0) return 0;
    window.scrollBy(0, d);
    return d;
  }
  raiz.addEventListener('focusin', function (e) {
    var t = e.target; if (!t || !t.matches || !t.matches('[data-qtd]')) return;
    setTimeout(function () { acimaDaBarra(t); }, 0);
  });
  raiz.addEventListener('paste', function (e) {
    var t = e.target; if (!t.matches || !t.matches('[data-qtd]')) return;
    var texto = (e.clipboardData || window.clipboardData).getData('text'), rows = IMP.tabela(texto);
    if (rows.length <= 1 && (rows[0] || []).length <= 1) return;   // um valor só: cola normal
    e.preventDefault(); colarNaLista(texto, t.dataset.qtd);
  });
  raiz.addEventListener('dragover', function (e) { var d = e.target.closest && e.target.closest('[data-drop]'); if (d) { e.preventDefault(); d.classList.add('is-sobre'); } });
  raiz.addEventListener('dragleave', function (e) { var d = e.target.closest && e.target.closest('[data-drop]'); if (d) d.classList.remove('is-sobre'); });
  raiz.addEventListener('drop', function (e) { var d = e.target.closest && e.target.closest('[data-drop]'); if (!d) return; e.preventDefault(); if (e.dataTransfer.files[0]) impArquivo(e.dataTransfer.files[0]); });
  // colar direto na tela (fora de um campo): na contagem abre a prévia
  document.addEventListener('paste', function (e) {
    if (!e.target || (e.target.closest && e.target.closest('input,textarea'))) return;
    var t = e.clipboardData && e.clipboardData.getData('text'); if (!t || t.indexOf('\t') < 0) return;
    if (S.tela !== 'contar') return;
    e.preventDefault(); colar(S.pac); var ta = document.querySelector('.inv-colar'); if (ta) { ta.value = t; ta.dispatchEvent(new Event('input')); }
  });
  // Sem gravação "cega" ao sair: cada alteração já grava (com a rev). Pergunta antes de fechar quando algo se perderia:
  // "Contar aqui" com quantidades (não grava no aparelho) ou navegador sem armazenamento com dados nesta aba.
  window.addEventListener('beforeunload', function (e) {
    var perde = (S.tela === 'contar' && S.pac && S.pac.local && Object.keys(S.pac.contagens).length) || (!DB && temDadosEmMemoria());
    if (perde) { e.preventDefault(); e.returnValue = ''; return ''; }
  });

  /** Lê o aparelho. Registro que não passa na validação vai para "Arquivos danificados" (com Apagar) e não derruba a tela. */
  function carregar() {
    return Promise.all([listar('inventarios'), listar('pacotes')]).then(function (r) {
      S.invs = []; S.pacs = []; S.danificados = []; S.resumos = {};
      (r[0] || []).forEach(function (rec) {
        try { S.invs.push(M.validarInventario(rec)); } catch (e) { S.danificados.push({ store: 'inventarios', chave: rec && rec.id, nome: rec && typeof rec.nome === 'string' ? rec.nome : '', erro: e.message }); }
      });
      (r[1] || []).forEach(function (rec) {
        try { var p = M.validarPacote(rec); p.chave = rec.chave; S.pacs.push(p); }
        catch (e) { S.danificados.push({ store: 'pacotes', chave: rec && rec.chave, nome: rec && rec.lista && typeof rec.lista.nome === 'string' ? rec.lista.nome : '', erro: e.message }); }
      });
      if (S.inv) S.inv = S.invs.find(function (x) { return x.id === S.inv.id; }) || null;
      desenhar();
    });
  }
  aplicarTema();
  try { if (window.matchMedia) window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () { if (!temaSalvo()) { aplicarTema(); botaoTema(); } }); } catch (e) { /* navegador antigo */ }
  abrirDb().then(function (d) { DB = d; return carregar(); }).catch(function (e) { raiz.innerHTML = '<p class="inv-erro">Falha ao abrir: ' + h(e.message) + '</p>'; });
})();
</script>
