name: Verify VM release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci --prefix server --ignore-scripts --no-audit --no-fund
      - run: npm --prefix server test
      - run: npm audit --prefix server --omit=dev --audit-level=high
      - name: Syntax check
        shell: bash
        run: |
          set -euo pipefail
          find server/src -name '*.js' -print0 | xargs -0 -n1 node --check
