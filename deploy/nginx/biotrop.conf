# BIOTROP · nginx na frente do Node (127.0.0.1:3000).
#
# Instalação (Ubuntu): copie para /etc/nginx/sites-available/biotrop, crie o link em
# sites-enabled, remova o site "default" do pacote e rode `sudo nginx -t && sudo systemctl reload nginx`.
# Certificado Let's Encrypt pelo modo webroot (usa a location ACME da porta 80 abaixo):
#   sudo install -d -m 755 /var/www/letsencrypt
#   sudo certbot certonly --webroot -w /var/www/letsencrypt -d manutencao.biotrop.com.br
#
# Este arquivo é incluído DENTRO do bloco http {} do /etc/nginx/nginx.conf. Por isso:
#  • map e log_format ficam aqui no nível http (nomes exclusivos, sem conflito com o nginx.conf);
#  • as diretivas de TLS ficam DENTRO de cada server 443, e iguais nos dois. Não mova para o nível
#    http: o nginx.conf do Ubuntu já declara ssl_protocols ali e o nginx SOMA valores repetidos
#    dessa diretiva (TLSv1.2 voltaria a ser aceito sem aviso claro). E o protocolo é negociado com
#    a configuração do default_server da porta, antes de o SNI escolher o site — por isso o bloco
#    catch-all repete exatamente as mesmas diretivas.

# ---------------------------------------------------------------------------------------------
# Log com privacidade (LGPD): IP truncado, sem query string, sem User-Agent e sem Referer.
# ---------------------------------------------------------------------------------------------
# IPv4: zera o último octeto (200.10.30.44 → 200.10.30.0). IPv6: mantém só o prefixo /48.
# Qualquer outro formato vira "::" (anônimo).
map $remote_addr $biotrop_ip_log {
  ~^(?<biotrop_ip4>\d+\.\d+\.\d+)\.\d+$                                 $biotrop_ip4.0;
  ~^(?<biotrop_ip6>[0-9A-Fa-f]+:[0-9A-Fa-f]+:[0-9A-Fa-f]+):             $biotrop_ip6::;
  default                                                                ::;
}

# $uri (e NÃO $request_uri/$request/$args): o retorno do login Microsoft traz ?code=...&state=...
# na query string, e esses valores não podem parar em log. Atenção: o error_log do nginx ainda
# registra a linha da requisição quando há erro de upstream; mantenha-o com acesso restrito (root/adm).
log_format biotrop_privacidade escape=json
  '{"t":"$time_iso8601","ip":"$biotrop_ip_log","host":"$host","metodo":"$request_method",'
  '"uri":"$uri","status":$status,"bytes":$body_bytes_sent,"duracao":$request_time,'
  '"upstream":"$upstream_response_time"}';

# ---------------------------------------------------------------------------------------------
# Terminal do almoxarifado (tablet): só da rede interna.
# ---------------------------------------------------------------------------------------------
# O login do terminal é só matrícula + senha (sem Microsoft nem 2FA). Aberto na internet, qualquer
# um poderia testar senhas em matrículas sequenciais e travar de propósito a credencial de outra
# pessoa (5 erros = bloqueio temporário, inclusive da saída administrativa). Por isso /terminal e
# /api/terminal só respondem às faixas abaixo; de fora, 403 aqui, antes de chegar ao Node.
# AJUSTE NA INSTALAÇÃO: troque as faixas privadas pela rede do almoxarifado ou pelo IP fixo do
# tablet. Se o tablet chega à VM pela internet (sem VPN), libere só o IP público fixo da fábrica.
# Vale o IP que o nginx vê ($remote_addr): com balanceador na frente, ver docs/DEPLOY-TI.md, seção 9.
geo $biotrop_terminal_rede {
  default         0;
  127.0.0.1/32    1;
  10.0.0.0/8      1;
  172.16.0.0/12   1;
  192.168.0.0/16  1;
}

# ---------------------------------------------------------------------------------------------
# Catch-all: Host desconhecido (acesso pelo IP, domínio de terceiros apontado para a VM,
# requisição sem Host) é encerrado sem resposta (444).
# ---------------------------------------------------------------------------------------------
server {
  listen 80 default_server;
  server_name _;
  server_tokens off;
  access_log /var/log/nginx/biotrop-access.log biotrop_privacidade;
  return 444;
}

server {
  listen 443 ssl http2 default_server;
  server_name _;
  server_tokens off;
  access_log /var/log/nginx/biotrop-access.log biotrop_privacidade;

  # Com nginx >= 1.19.4 (Ubuntu 22.04 traz 1.18) prefira recusar o próprio handshake, sem
  # apresentar certificado: descomente a linha abaixo e remova as duas linhas ssl_certificate*.
  # ssl_reject_handshake on;
  ssl_certificate /etc/letsencrypt/live/manutencao.biotrop.com.br/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/manutencao.biotrop.com.br/privkey.pem;

  # --- TLS: manter IDÊNTICO ao bloco do site (ver cabeçalho) ---
  ssl_protocols TLSv1.3;
  # EXCEÇÃO DOCUMENTADA (desligada): só habilite TLS 1.2 se a TI registrar um cliente
  # corporativo que comprovadamente não fala TLS 1.3 (sistema, versão, responsável e prazo de
  # retirada). Nesse caso troque a linha ssl_protocols acima pelas duas abaixo, nos DOIS blocos
  # 443 — somente AEAD com troca de chave ECDHE (sigilo futuro), sem CBC, sem RSA estático:
  # ssl_protocols TLSv1.2 TLSv1.3;
  # ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;
  # 0-RTT desligado explicitamente: dados antecipados podem ser repetidos (replay).
  ssl_early_data off;

  return 444;
}

# ---------------------------------------------------------------------------------------------
# Porta 80 do site: só o desafio ACME e o redirecionamento para HTTPS.
# ---------------------------------------------------------------------------------------------
server {
  listen 80;
  server_name manutencao.biotrop.com.br;
  server_tokens off;
  access_log /var/log/nginx/biotrop-access.log biotrop_privacidade;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/letsencrypt;
    default_type text/plain;
    try_files $uri =404;
  }

  location / {
    # Nome fixo (não $host): o redirecionamento nunca aponta para um domínio vindo do cliente.
    return 301 https://manutencao.biotrop.com.br$request_uri;
  }
}

# ---------------------------------------------------------------------------------------------
# Site em HTTPS
# ---------------------------------------------------------------------------------------------
server {
  listen 443 ssl http2;
  server_name manutencao.biotrop.com.br;
  server_tokens off;
  access_log /var/log/nginx/biotrop-access.log biotrop_privacidade;

  ssl_certificate /etc/letsencrypt/live/manutencao.biotrop.com.br/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/manutencao.biotrop.com.br/privkey.pem;

  # --- TLS: manter IDÊNTICO ao bloco catch-all (ver cabeçalho e a exceção documentada lá) ---
  ssl_protocols TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;
  ssl_early_data off;

  # O app aceita JSON de até 2 MB; 3 MB cobre cabeçalhos e codificação sem abrir espaço para abuso.
  client_max_body_size 3m;

  # Cabeçalhos: o app (helmet) já envia CSP, X-Content-Type-Options, Referrer-Policy e
  # X-Frame-Options — não repita aqui. O HSTS fica SÓ no nginx: o cabeçalho do upstream é
  # descartado para não haver dois valores diferentes.
  # Sem "preload": entrar na lista de pré-carga dos navegadores vale para biotrop.com.br e todos
  # os subdomínios, é difícil de reverter e exige decisão do dono do domínio.
  proxy_hide_header Strict-Transport-Security;
  proxy_hide_header X-Powered-By;
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
  # Recursos que o site não usa ficam bloqueados. Geolocalização é usada (registro com GPS);
  # tela cheia, autoplay, picture-in-picture e sensores ficam no padrão por causa do player do YouTube.
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=(), usb=(), serial=(), hid=(), bluetooth=(), midi=(), magnetometer=(), display-capture=()" always;
  # Atenção: add_header dentro de uma location substitui TODOS os de cima. Não use add_header nas
  # locations abaixo; se precisar, repita os dois cabeçalhos lá (como na do inventário).

  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # O app confia em exatamente 1 proxy (TRUST_PROXY=1): enviamos só o IP real, sem repassar
    # uma cadeia X-Forwarded-For forjada pelo cliente.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Terminal do almoxarifado: página e API só da rede liberada no "geo" do topo; o resto igual ao
  # "location /". Regex sem diferenciar maiúsculas e com barra final opcional, como o roteador do
  # Express: /API/Terminal/entrar também chega ao terminal e não pode escapar da regra.
  location ~* ^/api/terminal(/|$) {
    default_type application/json;
    if ($biotrop_terminal_rede = 0) { return 403 '{"ok":false,"erro":"O terminal só funciona na rede do almoxarifado."}'; }
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location ~* ^/terminal(\.html)?/?$ {
    if ($biotrop_terminal_rede = 0) { return 403; }
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Inventário offline (HTML solo): a ÚNICA página com câmera, para o leitor de código (BarcodeDetector).
  # add_header aqui substitui os de cima: os dois cabeçalhos são repetidos, só camera muda para (self).
  location = /ferramentas/inventario.html {
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(self), payment=(), usb=(), serial=(), hid=(), bluetooth=(), midi=(), magnetometer=(), display-capture=()" always;
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # O callback contém código OAuth na query: erros do upstream não devem registrar a linha completa.
  location = /auth/microsoft/callback {
    error_log /dev/null;
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  # Tempo real (Server-Sent Events): sem buffer e com conexão longa.
  location /api/realtime {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_cache off;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 1h;
  }
}
